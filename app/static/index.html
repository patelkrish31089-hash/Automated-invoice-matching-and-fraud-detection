  function runPayments() {
    var button = $("payRunBtn");
    if (button) { button.disabled = true; button.innerHTML = '<span class="spin"></span> running…'; }
    api("/api/payments/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function (body) {
        State.lastRun = body.run;
        var run = $("runBody");
        if (run) run.innerHTML = runSummary(State.lastRun);
        var released = arr(body.run.paid).length;
        toast(released ? "Released " + released + " payment(s) · " + money0(body.run.total_paid) : "Nothing to pay — every approved invoice was already released");
        return loadPayments();
      })
      .catch(function (error) { toast("Payment run failed: " + error.message); })
      .then(function () { if (button) { button.disabled = false; button.textContent = "Run payments"; } });
  }

  function showRemittance(paymentId) {
    var holder = $("remitBody");
    if (holder) holder.innerHTML = '<span class="muted"><span class="spin"></span> fetching advice…</span>';
    api("/api/payments/remittance", { method: "POST", headers: { "Content-Type": "application/json" },

      .catch(function (error) { if (holder) holder.textContent = "Could not build advice: " + error.message; });

  function viewContracts() {
    return '<div class="grid kpis" style="margin-bottom:14px"><div id="contractKpis" style="display:contents">' +
      '<div class="card kpi"><div class="skel" style="height:64px"></div></div></div></div>' +
      '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Master agreements</h3>' +
      '<span class="sub">rate cards, terms, and what they caught</span><span class="spacer"></span><div id="contractMeta"></div></div>' +
      '<div id="contractTable"><div class="skel" style="height:220px"></div></div></div>' +
      '<div class="grid c2e">' +
      '<div class="card"><div class="card-h"><h3>Generative parsing</h3><span class="sub">LLM output is verified before it is trusted</span></div>' +
      '<div class="card-b" id="llmBody"><div class="skel" style="height:180px"></div></div></div>' +
      '<div class="card"><div class="card-h"><h3>Clause findings</h3><span class="sub">what the agreement caught on live invoices</span></div>' +

  function contractKpis(summary) {
    var coverage = summary.coverage || {};
    var agreements = arr(summary.agreements);
    var exposed = Number(coverage.exposure_from_documents || 0) ||
      agreements.reduce(function (sum, row) { return sum + Number(row.exposure || 0); }, 0);
    var lines = agreements.reduce(function (sum, row) { return sum + arr(row.rate_lines).length; }, 0);
    return kpiTile({ label: "Agreements on file", value: String(summary.contracts || 0),
                     foot: agreements.length + " vendors covered" }) +
      kpiTile({ label: "Rate lines", value: String(lines), foot: "negotiated prices held" }) +
      kpiTile({ label: "Invoices checked", value: String(coverage.invoices_with_contract || 0),
                foot: (coverage.lines_compared || 0) + " lines compared" }) +
      kpiTile({ label: "Contract exposure", value: money0(exposed), foot: "billed above the agreed rate",
                right: exposed ? '<span class="chip bad">recoverable</span>' : "" }) +
      kpiTile({ label: "Parsing mode", value: (summary.llm || {}).mode === "llm" ? "LLM" : "Rule-based",
                foot: (summary.llm || {}).provider || "no provider configured" });
  }

  function contractTable(agreements, contracts) {
    if (!agreements.length) return '<div class="empty">No agreements loaded.</div>';
    return '<div style="overflow:auto"><table><thead><tr><th>Supplier</th><th>Agreement</th><th>Validity</th>' +
      '<th class="t-right">Net</th><th class="t-right">Cap</th><th class="t-right">Discount</th>' +
      '<th class="t-right">Rate lines</th><th class="t-right">Invoices</th><th class="t-right">Exposure</th>' +
      "<th>Findings</th></tr></thead><tbody>" + agreements.map(function (row) {
        var types = Object.keys(row.findings_by_type || {});
        var lineCount = arr(row.rate_lines).length;
        var discount = row.early_payment_discount_pct ? num(row.early_payment_discount_pct, 2) + "%/" +
          (row.early_payment_window_days || row.early_payment_discount_window_days || "?") + "d" : "—";
        return "<tr><td><div class=\"cell-vendor\">" + avatar(row.vendor_name) + "<b>" + esc(row.vendor_name) + "</b></div></td>" +
          '<td class="mono muted" style="font-size:11.5px">' + esc(row.contract_id) + "</td>" +
          '<td class="muted" style="font-size:11.5px">' + esc(row.effective_from || "") + " → " + esc(row.effective_to || "") + "</td>" +
          '<td class="t-right num">' + esc(String(row.payment_terms_days === null || row.payment_terms_days === undefined ? "—" : row.payment_terms_days)) + "</td>" +
          '<td class="t-right num">' + (row.max_price_escalation_pct ? num(row.max_price_escalation_pct, 1) + "%" : "—") + "</td>" +
          '<td class="t-right num">' + esc(discount) + "</td>" +
          '<td class="t-right num">' + lineCount + "</td>" +
          '<td class="t-right num">' + (row.invoices || 0) + "</td>" +
          '<td class="t-right num">' + (row.exposure ? money(row.exposure) : "—") + "</td>" +
          "<td>" + (types.length ? types.map(function (t) {
            return '<span class="chip bad">' + esc(String(t).replace(/_/g, " ").toLowerCase()) + "</span>";
          }).join(" ") : '<span class="chip ok">compliant</span>') + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function llmPanel(summary) {
    var llm = summary.llm || {};
    var usage = llm.usage || {};
    var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
      '<span class="chip ' + (llm.mode === "llm" ? "ok" : "muted") + '">' + esc(llm.mode || "deterministic-only") + "</span>" +
      '<span class="chip muted">' + esc(llm.provider || "no provider") + "</span>" +
      (llm.model ? '<span class="chip muted">' + esc(llm.model) + "</span>" : "") + "</div>";
    html += '<div class="muted" style="font-size:12.5px;margin-bottom:12px">' +
      "The deterministic parser always runs, so an unconfigured or unreachable model never blocks a payment. " +
      "When a provider is configured, the model structures the agreement and every rate it returns is validated: " +
      "positive, inside the plausible band for the part, present in the source text, and cross-checked against the " +
      "rule-based pass. A hallucinated rate is rejected with the reason recorded.</div>";
    var parsed = summary.parsed || {};
    html += '<table><tbody>' +
      "<tr><td>Prompt tokens</td><td class=\"t-right num\">" + (usage.prompt_tokens || 0) + "</td></tr>" +
      "<tr><td>Completion tokens</td><td class=\"t-right num\">" + (usage.completion_tokens || 0) + "</td></tr>" +
      "<tr><td>Spend</td><td class=\"t-right num\">$" + num(usage.cost_usd || 0, 6) + "</td></tr>" +
      "<tr><td>Latency</td><td class=\"t-right num\">" + (usage.latency_ms || 0) + " ms</td></tr>" +
      "<tr><td>Agreement corpus</td><td class=\"t-right num\">" + (summary.contracts || 0) + " agreements</td></tr>" +
      "<tr><td>Rate lines extracted</td><td class=\"t-right num\">" +
        arr(summary.agreements).reduce(function (sum, row) { return sum + arr(row.rate_lines).length; }, 0) + "</td></tr>" +
      "</tbody></table>";
    if (llm.note) html += '<div class="muted" style="font-size:11.5px;margin-top:10px">' + esc(llm.note) + "</div>";
    return html;
  }

  function clausePanel(agreements) {
    var findings = [];
    agreements.forEach(function (row) {
      Object.keys(row.findings_by_type || {}).forEach(function (type) {
        findings.push({ vendor: row.vendor_name, type: type, count: row.findings_by_type[type],
                        exposure: row.exposure });
      });
    });
    if (!findings.length) {
      return '<div class="muted" style="font-size:12.5px">Every line on every checked invoice reconciled ' +
        "against its negotiated rate.</div>";
    }
    return '<div class="stack">' + findings.map(function (row) {
      return '<div class="finding MEDIUM"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:12.5px">' +
        esc(row.vendor) + '</b><span class="spacer"></span><span class="chip bad">' + money(row.exposure) + "</span></div>" +
        '<div class="msg">' + esc(String(row.type).replace(/_/g, " ").toLowerCase()) + " on " + row.count + " invoice(s)</div></div>";
    }).join("") + "</div>";
  }

  function loadContracts() {
    api("/api/contracts").then(function (body) {
      State.contracts = body.contracts || {};
      var summary = State.contracts;
      var kpis = $("contractKpis");
      if (kpis) kpis.innerHTML = contractKpis(summary);
      var table = $("contractTable");
      if (table) table.innerHTML = contractTable(arr(summary.agreements), summary);
      var meta = $("contractMeta");
      if (meta) meta.innerHTML = '<span class="chip muted">' + esc(summary.directory || "data/samples/contracts") + "</span>" +
        '<span class="chip muted">' + esc((summary.llm || {}).mode || "deterministic-only") + "</span>";
      var llm = $("llmBody");
      if (llm) llm.innerHTML = llmPanel(summary);
      var clause = $("clauseBody");
      if (clause) clause.innerHTML = clausePanel(arr(summary.agreements));
    }).catch(function (error) {
      var table = $("contractTable");
      if (table) table.innerHTML = '<div class="banner bad">' + esc(error.message) + "</div>";
    });
  }

  /* =========================================================================

  function viewBlocks() {
    return '<div class="grid kpis" style="margin-bottom:14px"><div id="blockKpis" style="display:contents">' +
      '<div class="card kpi"><div class="skel" style="height:64px"></div></div></div></div>' +
      '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Sealed blocks</h3>' +
      '<span class="sub">Merkle-rooted batches of ledger records, anchored outside the database</span>' +
      '<span class="spacer"></span><button class="btn primary" data-action="seal-blocks" id="sealBtn">Seal pending records</button></div>' +
      '<div id="blockTable"><div class="skel" style="height:200px"></div></div></div>' +
      '<div class="grid c2e">' +
      '<div class="card"><div class="card-h"><h3>Inclusion proof</h3>' +
      '<span class="sub">prove one invoice is in a sealed block</span></div><div class="card-b">' +
      '<div style="display:flex;gap:8px;margin-bottom:12px"><input id="proofInput" class="input" placeholder="invoice id, e.g. INV-…" style="flex:1">' +
      '<button class="btn" data-action="verify-proof">Verify</button></div>' +
      '<pre id="proofBody" class="remit" style="max-height:260px">Every ledger record is a leaf; a proof is the sibling ' +
      "hashes needed to rebuild the root. Verification needs only the proof, the root and the record — no access to this database." +
      "</pre></div></div>" +
      '<div class="card"><div class="card-h"><h3>Independent verification</h3>' +
      '<span class="sub">check the trail without trusting the app</span></div><div class="card-b" id="anchorBody">' +
      '<div class="skel" style="height:180px"></div></div></div></div>';
  }

  function blockKpis(blocks) {
    var chain = blocks || {};
    var list = arr(chain.blocks);
    var anchored = list.filter(function (b) { return (b.anchor || {}).anchored; }).length;
    var records = list.reduce(function (sum, b) { return sum + (b.record_count || 0); }, 0);
    var latest = list[0] || {};
    return kpiTile({ label: "Chain status", value: chain.valid ? "Intact" : "Broken",
                     foot: (chain.blocks ? (chain.blocks.length || 0) : 0) + " blocks sealed",
                     right: '<span class="chip ' + (chain.valid ? "ok" : "bad") + '">' + (chain.valid ? "verified" : "tampered") + "</span>" }) +
      kpiTile({ label: "Records sealed", value: String(chain.records_sealed || records),
                foot: (chain.pending_records || 0) + " awaiting the next seal" }) +
      kpiTile({ label: "Anchored blocks", value: String(anchored || (chain.blocks ? 0 : 0)),
                foot: "root published outside the process" }) +
      kpiTile({ label: "Anchor sink", value: esc(chain.anchor_sink || "none"),
                foot: "file · HTTP notary · on-chain" }) +
      kpiTile({ label: "Latest root", value: '<span class="mono" style="font-size:13px">' +
                esc(String(latest.merkle_root || "—").slice(0, 16)) + "…</span>", foot: "Merkle root of the newest block" });
  }

  function blockTable(blocks) {
    var list = arr(blocks.blocks);
    if (!list.length) {
      return '<div class="empty"><b>No blocks sealed yet</b>Seal the ledger records to produce the first anchored block.</div>';
    }
    return '<div style="overflow:auto;max-height:420px"><table><thead><tr><th class="t-right">#</th><th>Sealed</th>' +
      '<th class="t-right">Records</th><th class="t-right">Range</th><th>Merkle root</th><th>Block hash</th><th>Anchor</th></tr></thead><tbody>' +
      list.map(function (block) {
        var anchor = block.anchor || {};
        return '<tr><td class="num">' + block.index + '</td><td class="muted" style="font-size:11.5px">' + when(block.sealed_at) + "</td>" +
          '<td class="t-right num">' + (block.record_count || 0) + "</td>" +
          '<td class="t-right num muted">' + (block.first_seq || "—") + "–" + (block.last_seq || "—") + "</td>" +
          '<td class="mono" style="font-size:11px">' + esc(String(block.merkle_root || "").slice(0, 20)) + "…</td>" +
          '<td class="mono muted" style="font-size:11px">' + esc(String(block.block_hash || "").slice(0, 16)) + "…</td>" +
          "<td>" + (anchor.anchored ? '<span class="chip ok">anchored</span>' : '<span class="chip muted">local</span>') + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function anchorPanel(blocks) {
    var list = arr(blocks.blocks);
    var anchored = list.filter(function (b) { return (b.anchor || {}).anchored; });
    var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
      '<span class="chip ' + (blocks.valid ? "ok" : "bad") + '">' + (blocks.valid ? "ledger intact" : "ledger broken") + "</span>" +
      '<span class="chip muted">' + esc(blocks.anchor_sink || "null") + " anchor</span>" +
      '<span class="chip muted">block size ' + (blocks.block_size || "—") + "</span></div>";
    if (anchored.length) {
      html += '<div class="stack">' + anchored.slice(0, 3).map(function (block) {
        return '<div class="finding LOW"><div class="msg">Block ' + block.index + " anchored" +
          '</div><div class="ev">' + esc(JSON.stringify(block.anchor).slice(0, 220)) + "</div></div>";
      }).join("") + "</div>";
    }
    html += '<div class="sep"></div><div class="muted" style="font-size:12px">Verify offline with the shipped script — ' +
      "it re-hashes every record, rebuilds every Merkle root and checks the anchor receipts without importing this application:</div>" +
      '<pre class="remit" style="margin-top:8px">python scripts/verify_audit_chain.py\n' +
      "python scripts/verify_audit_chain.py --tamper-test   # proves a forged record is detected</pre>";
    return html;
  }

  function loadBlocks() {
    api("/api/ledger/blocks").then(function (body) {
      State.blocks = body;
      var kpis = $("blockKpis");
      if (kpis) kpis.innerHTML = blockKpis(body);
      var table = $("blockTable");
      if (table) table.innerHTML = blockTable(body);
      var anchor = $("anchorBody");
      if (anchor) anchor.innerHTML = anchorPanel(body);
    }).catch(function (error) {
      var table = $("blockTable");
      if (table) table.innerHTML = '<div class="banner bad">' + esc(error.message) + "</div>";
    });
  }

  function sealBlocks() {
    var button = $("sealBtn");
    if (button) { button.disabled = true; button.innerHTML = '<span class="spin"></span> sealing…'; }
    api("/api/ledger/seal", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" })
      .then(function (body) {
        toast(body.sealed_blocks ? "Sealed " + body.sealed_blocks + " block(s)" : "Nothing new to seal");
        return loadBlocks();
      })
      .catch(function (error) { toast("Seal failed: " + error.message); })
      .then(function () { if (button) { button.disabled = false; button.textContent = "Seal pending records"; } });
  }

  function verifyProof() {
    var input = $("proofInput");
    var holder = $("proofBody");
    var invoiceId = input ? input.value.trim() : "";
    if (!invoiceId) { toast("Enter an invoice id first"); return; }
    if (holder) holder.textContent = "Verifying…";
    api("/api/ledger/proof/" + encodeURIComponent(invoiceId)).then(function (body) {
      State.proof = body;
      var lines = [
        "Invoice      : " + (body.invoice_id || invoiceId),
        "Block        : " + (body.block_index === undefined ? "—" : body.block_index),
        "Merkle root  : " + (body.merkle_root || "—"),
        "Record hash  : " + (body.record_hash || "—"),
        "Siblings     : " + arr((body.proof || {}).siblings).length,
        "Verified     : " + (body.verified ? "YES — proof rebuilds the sealed root" : "NO"),
        "",
        JSON.stringify(body.proof || {}, null, 1).slice(0, 900)
      ];
      if (holder) holder.textContent = lines.join("\n");
      toast(body.verified ? "Inclusion proven" : "Proof did not verify");
    }).catch(function (error) {
      if (holder) holder.textContent = "No proof: " + error.message;
    });
  }

  function render() {
    var title = TITLES[State.view] || TITLES.overview;
    $("crumbRoot").textContent = title[0];
    $("viewTitle").textContent = title[1];
    document.querySelectorAll("#nav button").forEach(function (button) {
      button.classList.toggle("active", button.getAttribute("data-view") === State.view);
    });
    try {
      var html = "";
      if (State.view === "overview") html = viewOverview();
      else if (State.view === "queue") html = viewQueue();
      else if (State.view === "invoices") html = viewInvoices();
      else if (State.view === "fraud") html = viewFraud();
      else if (State.view === "network") html = viewNetwork();
      else if (State.view === "ingest") html = viewIngest();
      else if (State.view === "payments") html = viewPayments();
      else if (State.view === "contracts") html = viewContracts();
      else if (State.view === "blocks") html = viewBlocks();
      else html = viewAudit();
      $("view").innerHTML = '<div class="view-inner">' + html + "</div>";
    } catch (error) {
      $("view").innerHTML = '<div class="view-inner"><div class="banner bad"><div><b>Could not render this view</b>' +
        '<div class="muted" style="margin-top:4px">' + esc(error.message) + "</div></div></div></div>";
      console.error(error);
    }
    afterRender();
  }

  function afterRender() {
    if (State.view === "fraud") loadFraudPanels();
    if (State.view === "payments") loadPayments();
    if (State.view === "contracts") loadContracts();
    if (State.view === "blocks") loadBlocks();
    if (State.view === "network" && !State.network) loadNetwork();
    if (State.view === "ingest") loadIngest();
    if (State.view === "audit") {
      $("auditKpis").innerHTML = auditKpis();
      loadAudit();
    }
    animateMeters();
  }

  function earlyPaymentTile(block) {
    var captured = Number(block.captured_with_automation || 0);
    var eligible = block.invoices_eligible || 0;
    return kpiTile({
      label: "Early-payment discount",
      value: money0(captured),
      foot: eligible + " invoices · " + (block.policy || "2/10 Net 30"),
      title: (block.note || "") + (block.modelled ? " Modelled, not measured." : "")
    });
  }

  function auditKpis() {
    var data = State.dashboard;
    if (!data) return "";
    var summary = data.summary || {};
    return kpiTile({ label: "Ledger records", value: String(summary.invoices || 0), foot: "one per processed document" }) +
      kpiTile({ label: "Value posted to ERP", value: money0((data.erp || {}).posted_value),
                foot: ((data.erp || {}).posted_invoices || 0) + " auto-approved invoices" }) +
      kpiTile({ label: "Manual equivalent avoided", value: money0((summary.manual_equivalent || 0)),
                foot: "at $15.00 per invoice" }) +
      kpiTile({ label: "Compute spend", value: "$" + Number(summary.compute_cost || 0).toFixed(4),
                foot: "total for the run" }) +
      earlyPaymentTile((data.value_capture) || {});
  }

  function animateMeters() {
    var meters = document.querySelectorAll(".meter i, .track i");
    meters.forEach(function (bar) {
      var target = bar.style.width;
      bar.style.width = "0%";
      requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.width = target; }); });
    });
  }

  /* =========================================================================
     Data loading
     ========================================================================= */
  function loadAll() {
    var jobs = [
      api("/api/health").then(function (body) { State.health = body; renderHealth(); }),
      api("/api/dashboard").then(function (body) { State.dashboard = body; }),
      api("/api/invoices?limit=500&order=created_at%20ASC").then(function (body) { State.invoices = arr(body.invoices); })
    ];
    return Promise.all(jobs).then(function () {
      var queue = State.invoices.filter(function (row) { return row.decision !== "AUTO_APPROVED"; });
      $("navQueue").textContent = queue.length;
      $("runBadge").textContent = State.invoices.length ? State.invoices.length + " invoices" : "no run yet";
      render();
    }).catch(function (error) {
      toast("Load failed: " + error.message);
    });
  }

  function renderHealth() {
    var health = State.health || {};
    var ok = health.status === "ok";
    $("healthDot").className = "dot" + (ok ? "" : " bad");
    $("healthText").textContent = ok ? "Pipeline ready" : "Degraded";
    $("healthSub").textContent = (health.extractor || "").replace("Extractor", "") || "checking";
    $("envBlock").innerHTML = "OCR " + esc(health.tesseract || "?") + " · " + esc(health.ocr_engine || "") +
      "<br>Anomaly model " + esc(health.isolation_backend || "") + " · corpus " + esc(health.documents_available || 0) +
      "<br>Baselines " + esc(health.history_size || 0) + " historical invoices";
  }

  /* =========================================================================
     Actions
     ========================================================================= */
  function startRun(limit, reset) {
    $("runAll").disabled = true;
    $("runQuick").disabled = true;
    api("/api/jobs/corpus", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ limit: limit || null, reset: !!reset }) }).then(function (body) {
      toast("Processing " + body.documents + " documents…");
      State.job = body.job_id;
      pollJob();
    }).catch(function (error) {
      toast("Could not start: " + error.message);
      $("runAll").disabled = false;
      $("runQuick").disabled = false;
    });
  }

  function pollJob() {
    if (!State.job) return;
    api("/api/jobs/" + State.job).then(function (job) {
      var progress = job.total ? Math.round((job.done / job.total) * 100) : 0;
      $("runBadge").innerHTML = '<span class="spin"></span> ' + progress + "%";
      if (job.status === "DONE" || job.status === "FAILED") {
        State.job = null;
        $("runAll").disabled = false;
        $("runQuick").disabled = false;
        toast(job.status === "DONE" ? "Run complete — " + job.done + " documents" : "Run failed: " + job.error);
        loadAll();
        if (State.view === "ingest") loadIngest();
        return;
      }
      setTimeout(pollJob, 1200);
    }).catch(function () { setTimeout(pollJob, 2500); });
  }

  function applyCorrections() {
    var detail = State.detail;
    if (!detail) return;
    var payload = {};
    document.querySelectorAll("[data-correct]").forEach(function (input) {
      var field = input.getAttribute("data-correct");
      var original = field === "total" ? ((detail.totals || {}).total || "") : (detail[field] || "");
      if (String(input.value) !== String(original === null ? "" : original)) payload[field] = input.value;
    });
    if (!Object.keys(payload).length) { toast("Nothing changed."); return; }
    var button = $("applyCorrections");
    button.disabled = true;
    $("correctionResult").innerHTML = '<span class="spin"></span> re-assessing…';
    api("/api/invoices/" + detail.invoice_id + "/corrections", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ corrections: payload, clerk: "ap_clerk" })
    }).then(function (body) {
      var result = body.reassessed || {};
      toast("Re-assessed: " + result.decision_before + " → " + result.decision_after);
      loadAll();
      openInvoice(detail.invoice_id);
    }).catch(function (error) {
      button.disabled = false;
      $("correctionResult").textContent = "failed: " + error.message;
    });
  }

  function setReview(action) {
    if (!State.detail) return;
    api("/api/invoices/" + State.detail.invoice_id + "/review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: action, clerk: "ap_clerk" })
    }).then(function () { toast("Marked " + action); loadAll(); openInvoice(State.detail.invoice_id); })
      .catch(function (error) { toast("Failed: " + error.message); });
  }

  function uploadFile(file) {
    var form = new FormData();
    form.append("file", file);
    $("uploadResult").innerHTML = '<span class="muted"><span class="spin"></span> processing ' + esc(file.name) + "…</span>";
    api("/api/ingest/upload", { method: "POST", body: form }).then(function (body) {
      State.lastUpload = Object.assign({ filename: file.name }, body);
      $("uploadResult").innerHTML = uploadResult(State.lastUpload);
      toast("Uploaded and processed");
      loadAll();
    }).catch(function (error) {
      $("uploadResult").innerHTML = '<div class="banner bad">' + esc(error.message) + "</div>";
    });
  }

  function uploadResult(body) {
    return '<div class="banner ' + (body.decision === "AUTO_APPROVED" ? "ok" : "warn") + '">' +
      "<div><b>" + esc(body.filename || "document") + "</b> → " + decisionChip(body.decision) +
      " · risk " + num(body.risk_score, 2) +
      '<div class="muted mono" style="font-size:11px;margin-top:4px">' + esc(body.invoice_id || "") +
      (body.stored_at ? " · stored " + esc(body.stored_at) : "") + "</div></div></div>";
  }

  function emailResult(body) {
    var envelope = body.envelope || {}, flags = arr(body.injection_flags);
    var html = '<div class="mm-grid" style="margin-top:0;margin-bottom:12px;border-top:0;padding-top:0">' +
      '<div><span>from</span><b style="font-size:12.5px;font-weight:600">' + esc(envelope.from || envelope.sender || "—") + "</b></div>" +
      '<div><span>to</span><b style="font-size:12.5px;font-weight:600">' + esc(envelope.to || envelope.recipient || "—") + "</b></div>" +
      '<div><span>subject</span><b style="font-size:12.5px;font-weight:600">' + esc(envelope.subject || "—") + "</b></div>" +
      '<div><span>received</span><b style="font-size:12.5px;font-weight:600">' +
      esc(String(envelope.received_at || "").replace("T", " ").slice(0, 19)) + "</b></div></div>";
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="chip ' + (envelope.trusted_sender ? "ok" : "muted") + '">' +
      (envelope.trusted_sender ? "trusted domain" : "untrusted domain") + "</span>" +
      Object.keys(envelope.auth_results || {}).map(function (key) {
        return '<span class="chip ' + (envelope.auth_results[key] === "pass" ? "ok" : "bad") + '">' + esc(key) + "=" +
          esc(envelope.auth_results[key]) + "</span>";
      }).join("") + '<span class="chip muted">' + (body.attachments_accepted || 0) + " attachment(s)</span>" +
      (body.rejected ? '<span class="chip bad">' + body.rejected + " rejected</span>" : "") + "</div>";
    if (flags.length) {
      html += '<div class="banner bad" style="margin-bottom:10px"><div><b>Prompt-injection attempt blocked</b>' +
        '<div class="muted" style="margin-top:4px">The body tries to instruct the model: ' +
        flags.map(function (flag) { return "<code>" + esc(flag) + "</code>"; }).join(", ") +
        ". Instructions inside an email cannot rewrite approval rules.</div></div></div>";
    }
    if (arr(body.processed).length) {
      html += '<table><thead><tr><th>Attachment</th><th>Vendor read</th><th>Decision</th><th class="t-right">Risk</th></tr></thead><tbody>' +
        body.processed.map(function (row) {
          if (row.error) return "<tr><td>" + esc(row.filename) + '</td><td colspan="3" class="chip bad">' + esc(row.error) + "</td></tr>";
          return '<tr class="clickable" data-id="' + esc(row.invoice_id) + '"><td>' + esc(row.filename) + "</td><td>" +
            esc(row.vendor_name || "—") + "</td><td>" + decisionChip(row.decision) + '</td><td class="t-right num">' +
            num(row.risk_score, 2) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    return html;
  }

  /* =========================================================================
     Command palette
     ========================================================================= */
  function openPalette() {
    $("palette").classList.add("on");
    var input = $("paletteInput");
    input.value = "";
    input.focus();
    paletteSearch("");
  }
  function closePalette() { $("palette").classList.remove("on"); }

  function paletteSearch(needle) {
    var query = needle.trim().toLowerCase();
    var findings = [];
    arr((State.dashboard || {}).top_findings).forEach(function (finding) {
      findings.push({ kind: "finding", id: finding.invoice_id, title: String(finding.type).replace(/_/g, " "),
        sub: finding.vendor_name + " · " + finding.message.slice(0, 70), sev: finding.severity });
    });
    var pool = State.invoices.map(function (row) {
      return { kind: "invoice", id: row.invoice_id, title: row.vendor_name || "Unknown",
               sub: (row.invoice_number || "") + " · " + money(row.total_amount) + " · " + String(row.decision).replace(/_/g, " "),
               decision: row.decision, risk: row.risk_score };
    }).concat(findings);
    var results = query ? pool.filter(function (row) {
      return (row.title + " " + row.sub).toLowerCase().indexOf(query) >= 0;
    }).slice(0, 12) : pool.slice(0, 8);
    State.paletteResults = results;
    State.paletteIndex = 0;
    $("paletteRes").innerHTML = results.length ? results.map(function (row, index) {
      var badge = row.kind === "finding"
        ? '<span class="chip ' + esc(row.sev) + '">' + esc(row.sev) + "</span>"
        : decisionChip(row.decision);
      return '<div class="row' + (index === 0 ? " sel" : "") + '" data-id="' + esc(row.id) + '">' + badge +
        '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:560">' + esc(row.title) +
        '</div><div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(row.sub) + "</div></div><span class=\"muted\" style=\"font-size:11px\">" +
        (row.kind === "finding" ? "finding" : "invoice") + "</span></div>";
    }).join("") : '<div class="empty">No matches.</div>';
  }

  /* =========================================================================
     Events
     ========================================================================= */
  document.addEventListener("click", function (event) {
    var target = event.target;
    var closest = function (selector) { return target.closest ? target.closest(selector) : null; };

    var navButton = closest("#nav button");
    if (navButton) { State.view = navButton.getAttribute("data-view"); State.page = 0; render(); return; }

    var row = closest("[data-id]");
    if (row) {
      var id = row.getAttribute("data-id");
      if (id) {
        if (closest("#palette")) closePalette();
        openInvoice(id);
        return;
      }
    }

    var tab = closest("[data-tab]");
    if (tab) { State.drawerTab = tab.getAttribute("data-tab"); renderDrawer(); return; }

    var filter = closest("[data-filter]");
    if (filter) { State.filter.decision = filter.getAttribute("data-filter"); State.page = 0; render(); return; }

    var page = closest("[data-page]");
    if (page) {
      State.page += page.getAttribute("data-page") === "next" ? 1 : -1;
      if (State.page < 0) State.page = 0;
      render();
      return;
    }

    var sortHeader = closest("th[data-sort]");
    if (sortHeader) {
      var key = sortHeader.getAttribute("data-sort");
      if (State.sort.key === key) State.sort.dir *= -1;
      else { State.sort.key = key; State.sort.dir = key === "vendor_name" ? 1 : -1; }
      render();
      return;
    }

    var review = closest("[data-review]");
    if (review) { setReview(review.getAttribute("data-review")); return; }

    var action = closest("[data-action]");
    if (action) {
      var kind = action.getAttribute("data-action");
      if (kind === "run-all") { startRun(null); return; }
      if (kind === "run-payments") { runPayments(); return; }
      if (kind === "seal-blocks") { sealBlocks(); return; }
      if (kind === "verify-proof") { verifyProof(); return; }
    }

    var remit = closest("[data-remit]");
    if (remit) { showRemittance(remit.getAttribute("data-remit")); return; }

    if (closest("#applyCorrections")) { applyCorrections(); return; }
    if (closest("#searchBtn")) { openPalette(); return; }
    if (closest("#palette") && !closest(".row")) closePalette();

    var preset = closest("[data-preset]");
    if (preset) { State.filter.decision = preset.getAttribute("data-preset"); render(); }
  });

  document.addEventListener("change", function (event) {
    var target = event.target;
    if (target.id === "bandFilter") { State.filter.band = target.value; State.page = 0; render(); return; }
    if (target.getAttribute && target.getAttribute("data-overlay")) {
      var key = target.getAttribute("data-overlay");
      State.overlays[key] = target.checked;
      paintOverlay();
      return;
    }
    if (target.id === "fileInput" && target.files.length) { uploadFile(target.files[0]); return; }
    if (target.id === "emlInput" && target.files.length) {
      var form = new FormData();
      form.append("file", target.files[0]);
      $("emailResult").innerHTML = '<span class="muted"><span class="spin"></span> parsing message…</span>';
      api("/api/ingest/email", { method: "POST", body: form }).then(function (body) {
        State.lastEmail = body;
        $("emailResult").innerHTML = emailResult(body);
        toast("Message ingested");
        loadAll();
      }).catch(function (error) { $("emailResult").innerHTML = '<div class="banner bad">' + esc(error.message) + "</div>"; });
    }
  });

  document.addEventListener("input", function (event) {
    var target = event.target;
    if (target.id === "tableSearch") {
      State.filter.q = target.value;
      State.page = 0;
      var list = filteredInvoices();
      var table = document.querySelector("#view table");
      if (table) {
        var wrapper = table.parentElement;
        wrapper.innerHTML = invoiceRows(list.slice(0, State.pageSize), { showAgreement: state0() });
      }
      return;
    }
    if (target.id === "paletteInput") { paletteSearch(target.value); return; }
  });

  function state0() { return true; }

  document.addEventListener("keydown", function (event) {
    var meta = event.metaKey || event.ctrlKey;
    if (meta && event.key.toLowerCase() === "k") { event.preventDefault(); openPalette(); return; }
    if (event.key === "/" && !/input|textarea|select/i.test(document.activeElement.tagName)) {
      event.preventDefault(); openPalette(); return;
    }
    if (event.key === "Escape") {
      if ($("palette").classList.contains("on")) { closePalette(); return; }
      if ($("drawer").classList.contains("on")) closeDrawer();
      return;
    }
    if ($("palette").classList.contains("on") && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
      event.preventDefault();
      State.paletteIndex += event.key === "ArrowDown" ? 1 : -1;
      var rows = $("paletteRes").querySelectorAll(".row");
      if (!rows.length) return;
      State.paletteIndex = (State.paletteIndex + rows.length) % rows.length;
      rows.forEach(function (row, index) { row.classList.toggle("sel", index === State.paletteIndex); });
      return;
    }
    if ($("palette").classList.contains("on") && event.key === "Enter") {
      var selected = $("paletteRes").querySelectorAll(".row")[State.paletteIndex];
      if (selected) { closePalette(); openInvoice(selected.getAttribute("data-id")); }
    }
  });

  $("dwClose").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  $("themeBtn").addEventListener("click", function () {
    State.theme = State.theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", State.theme);
    localStorage.setItem("ap-theme", State.theme);
    render();
  });
  $("railToggle").addEventListener("click", function () {
    State.railCollapsed = !State.railCollapsed;
    $("app").classList.toggle("rail-collapsed", State.railCollapsed);
    localStorage.setItem("ap-rail", State.railCollapsed ? "1" : "0");
  });

  document.addEventListener("click", function (event) {
    if (event.target.id === "runAll") startRun(null, false);
    if (event.target.id === "resetBtn") {
      if (window.confirm("Clear every processed invoice, finding and review record, then reprocess all 21 documents from scratch?\n\nThe ERP sandbox and fraud baselines are kept.")) {
        startRun(null, true);
      }
    }
    if (event.target.id === "runQuick") startRun(5);
    if (event.target.id === "sampleEmail") {
      var button = event.target;
      button.disabled = true;
      api("/api/ingest/email/sample", { method: "POST" }).then(function (body) {
        State.lastEmail = body;
        $("emailResult").innerHTML = emailResult(body);
        button.disabled = false;
        toast("Sample vendor email ingested");
        loadAll();
      }).catch(function (error) { button.disabled = false; toast("Failed: " + error.message); });
    }
    if (event.target.id === "emlPick") $("emlInput").click();
    if (event.target.id === "drop") $("fileInput").click();
  });

  /* drag and drop uploads */
  document.addEventListener("dragover", function (event) {
    var drop = event.target.closest ? event.target.closest("#drop") : null;
    if (!drop) return;
    event.preventDefault();
    drop.classList.add("on");
  });
  document.addEventListener("dragleave", function (event) {
    var drop = event.target.closest ? event.target.closest("#drop") : null;
    if (drop) drop.classList.remove("on");
  });
  document.addEventListener("drop", function (event) {
    var drop = event.target.closest ? event.target.closest("#drop") : null;
    if (!drop) return;
    event.preventDefault();
    drop.classList.remove("on");
    if (event.dataTransfer.files.length) uploadFile(event.dataTransfer.files[0]);
  });

  /* =========================================================================
     Boot
     ========================================================================= */
  document.documentElement.setAttribute("data-theme", State.theme);
  $("app").classList.toggle("rail-collapsed", State.railCollapsed);
  if (navigator.platform && /Mac/i.test(navigator.platform) === false) $("kbdHint").textContent = "Ctrl K";
  loadAll();
  setInterval(function () {
    if (State.view === "ingest") loadIngest();
  }, 4000);
})();
</script>
</body>
</html>
