<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AP Intelligence · Invoice Matching &amp; Fraud Detection</title>
<style>
/* ===========================================================================
   Design tokens
   =========================================================================== */
:root {
  --bg: #070A11;
  --bg-soft: #0B1018;
  --surface: #101725;
  --surface-2: #141D2C;
  --surface-3: #1A2436;
  --line: rgba(255,255,255,0.07);
  --line-strong: rgba(255,255,255,0.14);
  --text: #E9EFF9;
  --text-dim: #95A3B9;
  --text-faint: #64748B;
  --brand: #5B8DEF;
  --brand-2: #7C6BF5;
  --brand-soft: rgba(91,141,239,0.14);
  --ok: #34D399;
  --ok-soft: rgba(52,211,153,0.14);
  --warn: #FBBF24;
  --warn-soft: rgba(251,191,36,0.14);
  --danger: #FB7185;
  --danger-soft: rgba(251,113,133,0.14);
  --violet: #A78BFA;
  --violet-soft: rgba(167,139,250,0.14);
  --cyan: #22D3EE;
  --cyan-soft: rgba(34,211,238,0.14);
  --grid: rgba(255,255,255,0.045);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.30);
  --shadow-lg: 0 24px 64px rgba(0,0,0,.55);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --fast: 140ms; --med: 240ms;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #F4F6FA;
  --bg-soft: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #FAFBFD;
  --surface-3: #F1F4F9;
  --line: rgba(15,23,42,0.08);
  --line-strong: rgba(15,23,42,0.15);
  --text: #0E172A;
  --text-dim: #56657D;
  --text-faint: #8593A8;
  --brand: #2F6FED;
  --brand-2: #6D4AF0;
  --brand-soft: rgba(47,111,237,0.09);
  --ok: #067A55;
  --ok-soft: rgba(6,122,85,0.10);
  --warn: #A15C07;
  --warn-soft: rgba(161,92,7,0.10);
  --danger: #BE123C;
  --danger-soft: rgba(190,18,60,0.09);
  --violet: #6D28D9;
  --violet-soft: rgba(109,40,217,0.09);
  --cyan: #0E7490;
  --cyan-soft: rgba(14,116,144,0.09);
  --grid: rgba(15,23,42,0.05);
  --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
  --shadow-md: 0 1px 2px rgba(15,23,42,.05), 0 10px 24px rgba(15,23,42,.06);
  --shadow-lg: 0 24px 60px rgba(15,23,42,.16);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv02","cv03","cv04","ss01";
}
::selection { background: var(--brand-soft); }
h1,h2,h3,h4 { margin: 0; font-weight: 640; letter-spacing: -0.015em; }
a { color: var(--brand); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .tnum { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

/* Scrollbars */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }

/* ===========================================================================
   Shell
   =========================================================================== */
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; transition: grid-template-columns var(--med) var(--ease); }
.app.rail-collapsed { grid-template-columns: 74px 1fr; }

.rail {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
  border-right: 1px solid var(--line); padding: 16px 12px; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; flex: 0 0 34px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); box-shadow: 0 6px 18px rgba(91,141,239,.35); }
.brand-text { min-width: 0; }
.brand-text b { display: block; font-size: 13.5px; letter-spacing: -0.02em; white-space: nowrap; }
.brand-text span { display: block; font-size: 11px; color: var(--text-faint); white-space: nowrap; }
.app.rail-collapsed .brand-text, .app.rail-collapsed .nav-label, .app.rail-collapsed .rail-foot-text { display: none; }
.app.rail-collapsed .brand { justify-content: center; padding-left: 0; padding-right: 0; }

.nav { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.nav-section { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); padding: 14px 10px 6px; }
.app.rail-collapsed .nav-section { text-align: center; font-size: 9px; padding: 10px 0 4px; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: transparent; border: 0; color: var(--text-dim); padding: 9px 10px;
  border-radius: var(--r-sm); cursor: pointer; transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  position: relative;
}
.nav button:hover { background: var(--surface-2); color: var(--text); }
.nav button.active { background: var(--brand-soft); color: var(--text); }
.nav button.active::before { content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--brand); }
.nav button svg { flex: 0 0 17px; opacity: .9; }
.nav .pill { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-dim); }
.nav button.active .pill { background: var(--brand); color: #fff; }
.app.rail-collapsed .nav .pill { display: none; }
.app.rail-collapsed .nav button { justify-content: center; padding: 10px 0; }

.rail-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
.health { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); }
.health .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); flex: 0 0 7px; }
.health .dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.health b { font-size: 12px; font-weight: 600; }
.health span { font-size: 10.5px; color: var(--text-faint); display: block; }
.app.rail-collapsed .health b, .app.rail-collapsed .health span { display: none; }
.env { padding: 10px 10px 4px; font-size: 10.5px; color: var(--text-faint); line-height: 1.8; }
.env kbd { font-size: 10px; }

/* Topbar */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 12px;
  padding: 13px 22px; background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--line);
}
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--text-faint); font-size: 12px; }
.crumbs b { color: var(--text); font-size: 15px; letter-spacing: -0.02em; font-weight: 660; }
.crumbs .sep { opacity: .5; }
.spacer { flex: 1; }
.icon-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--text-dim);
  width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center; cursor: pointer;
  transition: all var(--fast) var(--ease); }
.icon-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--line-strong); }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer;
  font-size: 12.5px; font-weight: 560; transition: all var(--fast) var(--ease); white-space: nowrap;
}
.btn:hover { background: var(--surface-3); border-color: var(--line-strong); }
.btn.primary { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); border-color: transparent; color: #fff;
  box-shadow: 0 4px 14px rgba(91,141,239,.28); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 35%, transparent); color: var(--ok); }
.btn.danger { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 35%, transparent); color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.search {
  display: flex; align-items: center; gap: 8px; padding: 7px 11px; min-width: 250px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); cursor: text;
  transition: all var(--fast) var(--ease);
}
.search:hover { border-color: var(--line-strong); }
.search span { color: var(--text-faint); font-size: 12.5px; }
kbd { font-family: inherit; font-size: 10.5px; padding: 1.5px 5px; border-radius: 5px;
  background: var(--surface-3); border: 1px solid var(--line); color: var(--text-faint); }

.view { padding: 22px 22px 64px; }
.view-inner { max-width: 1560px; margin: 0 auto; }

/* ===========================================================================
   Primitives
   =========================================================================== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
.card.pad { padding: 16px 18px; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.card-h h3 { font-size: 13px; font-weight: 620; }
.card-h .sub { font-size: 11.5px; color: var(--text-faint); }
.card-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1520px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.c2 { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); }
.c2e { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.c3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
@media (max-width: 1200px) { .c2, .c2e, .c3 { grid-template-columns: 1fr; } }

.kpi { padding: 15px 17px 16px; }
.kpi .k-label { font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.kpi .k-value { font-size: 24px; font-weight: 680; letter-spacing: -0.035em; margin-top: 7px; line-height: 1.05; white-space: nowrap; }
.kpi .k-value.sm { font-size: 21px; }
.kpi .k-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--text-faint); }
.meter { height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 9px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--brand), var(--brand-2));
  width: 0; transition: width 900ms var(--ease); }
.meter.ok i { background: linear-gradient(90deg, var(--ok), color-mix(in srgb, var(--ok) 70%, var(--cyan))); }
.meter.warn i { background: linear-gradient(90deg, var(--warn), color-mix(in srgb, var(--warn) 70%, var(--danger))); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2.5px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 620; white-space: nowrap; border: 1px solid transparent; }
.chip.AUTO_APPROVED { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 26%, transparent); }
.chip.PENDING_REVIEW { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.chip.QUARANTINED { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 26%, transparent); }
.chip.REJECTED { background: var(--violet-soft); color: var(--violet); border-color: color-mix(in srgb, var(--violet) 26%, transparent); }
.chip.CRITICAL { background: var(--danger-soft); color: var(--danger); }
.chip.HIGH { background: var(--warn-soft); color: var(--warn); }
.chip.MEDIUM { background: color-mix(in srgb, var(--warn) 10%, transparent); color: color-mix(in srgb, var(--warn) 85%, var(--text)); }
.chip.LOW { background: var(--surface-3); color: var(--text-dim); }
.chip.INFO { background: var(--surface-3); color: var(--text-faint); }
.chip.muted { background: var(--surface-3); color: var(--text-dim); font-weight: 520; }
.chip.brand { background: var(--brand-soft); color: var(--brand); }
.chip.cyan { background: var(--cyan-soft); color: var(--cyan); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--danger-soft); color: var(--danger); }
.dotline { display: inline-block; width: 8px; height: 8px; border-radius: 3px; }
.muted { color: var(--text-faint); }
.dim { color: var(--text-dim); }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.empty { padding: 30px 20px; text-align: center; color: var(--text-faint); font-size: 12.5px; }
.empty b { display: block; color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
.banner { display: flex; gap: 11px; align-items: flex-start; padding: 13px 15px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; }
.banner.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner.bad { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.banner.brand { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 30%, transparent); }

/* Tables */
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint);
  font-weight: 620; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; z-index: 2; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text-dim); }
th .arrow { opacity: .45; margin-left: 3px; font-size: 9px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; vertical-align: middle; }
tbody tr { transition: background var(--fast) var(--ease); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.t-right { text-align: right; }
.avatar { width: 27px; height: 27px; border-radius: 8px; display: grid; place-items: center; font-size: 10.5px;
  font-weight: 700; color: #fff; flex: 0 0 27px; letter-spacing: .02em; }
.cell-vendor { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cell-vendor b { font-weight: 560; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.riskbar { width: 54px; height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; display: inline-block; vertical-align: middle; }
.riskbar i { display: block; height: 100%; border-radius: 3px; }

/* Toolbar / filters */
.toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px; }
.segmented button { border: 0; background: transparent; color: var(--text-dim); padding: 5px 11px; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 540; transition: all var(--fast) var(--ease); }
.segmented button:hover { color: var(--text); }
.segmented button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.segmented button .n { margin-left: 5px; color: var(--text-faint); font-size: 11px; }
.field { display: flex; align-items: center; gap: 7px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 6px 10px; }
.field input, .field select { background: transparent; border: 0; outline: 0; width: 100%; font-size: 12.5px; }
.field select { cursor: pointer; }
.pager { display: flex; align-items: center; gap: 8px; padding: 11px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-faint); }

/* Charts */
.chart { width: 100%; display: block; overflow: visible; }
.radar-panel { display: grid; grid-template-columns: minmax(210px, 290px) minmax(0, 1fr); gap: 20px; align-items: center; }
.radar-list { display: grid; gap: 9px; }
.radar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 40px; gap: 9px; align-items: center; font-size: 11.5px; }
.radar-name { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.radar-track { height: 6px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.radar-track i { display: block; height: 100%; border-radius: 4px; }
.radar-val { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-faint); }
@media (max-width: 760px) { .radar-panel { grid-template-columns: 1fr; } }
.mm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
.mm-grid div { display: flex; flex-direction: column; gap: 2px; }
.mm-grid span { color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }
.mm-grid b { font-size: 13.5px; font-weight: 620; font-variant-numeric: tabular-nums; }
.trail { display: grid; gap: 2px; }
.trail-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--line); }
.trail-row:last-child { border-bottom: 0; }
.trail-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--text-faint); }
.trail-dot.ok { background: var(--ok); } .trail-dot.bad { background: var(--danger); } .trail-dot.warn { background: var(--warn); }
.trail-body { font-size: 12.5px; }
.trail-body b { font-weight: 620; margin-right: 6px; }
.trail-body div { color: var(--text-dim); font-size: 11.5px; margin-top: 3px; word-break: break-word; }
.trail-when { color: var(--text-faint); font-size: 11px; white-space: nowrap; }
.chart text { font-family: inherit; fill: var(--text-faint); font-size: 10.5px; }
.chart .axis { stroke: var(--line); }
.chart .gridline { stroke: var(--grid); }
.chart .lbl { fill: var(--text-dim); font-size: 11px; }
.legend { display: flex; flex-direction: column; gap: 9px; }
.legend-row { display: flex; align-items: center; gap: 9px; font-size: 12px; }
.legend-row .k { flex: 1; color: var(--text-dim); }
.legend-row .v { font-weight: 620; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 11px; }
.bar-row .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.bar-row .top .l { color: var(--text-dim); }
.bar-row .top .r { font-variant-numeric: tabular-nums; font-weight: 600; }
.track { height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 4px; width: 0; transition: width 900ms var(--ease); }

/* Findings */
.finding { border: 1px solid var(--line); border-left: 2.5px solid var(--text-faint); border-radius: var(--r-md);
  padding: 11px 13px; background: var(--surface-2); transition: border-color var(--fast) var(--ease), transform var(--fast) var(--ease); }
.finding.clickable { cursor: pointer; }
.finding.clickable:hover { border-color: var(--line-strong); transform: translateX(2px); }
.finding.CRITICAL { border-left-color: var(--danger); }
.finding.HIGH { border-left-color: var(--warn); }
.finding.MEDIUM { border-left-color: color-mix(in srgb, var(--warn) 60%, var(--line)); }
.finding.LOW, .finding.INFO { border-left-color: var(--line-strong); }
.finding .msg { font-size: 12.5px; color: var(--text-dim); margin-top: 5px; }
.finding .ev { margin-top: 7px; font-size: 11px; color: var(--text-faint); font-family: ui-monospace, monospace;
  white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow: auto; }
.stack { display: flex; flex-direction: column; gap: 9px; }
.scroll-y { max-height: 460px; overflow: auto; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(3,6,12,.62); backdrop-filter: blur(3px);
  opacity: 0; pointer-events: none; transition: opacity var(--med) var(--ease); z-index: 60; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(1200px, 97vw); z-index: 70;
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg);
  transform: translateX(101%); transition: transform 280ms var(--ease); display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.drawer-h { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line);
  background: var(--bg-soft); }
.drawer-h .t { font-weight: 640; font-size: 15px; letter-spacing: -0.02em; }
.drawer-tabs { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--bg-soft); overflow-x: auto; }
.drawer-tabs button { border: 0; background: transparent; color: var(--text-dim); padding: 11px 13px; cursor: pointer;
  font-size: 12.5px; font-weight: 560; border-bottom: 2px solid transparent; white-space: nowrap; }
.drawer-tabs button:hover { color: var(--text); }
.drawer-tabs button.active { color: var(--text); border-bottom-color: var(--brand); }
.drawer-b { flex: 1; overflow: auto; padding: 18px 20px 60px; }
.doc-wrap { position: relative; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); background: #fff; }
.doc-wrap img { display: block; width: 100%; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.ov { position: absolute; border: 1.5px solid; border-radius: 3px; transition: opacity var(--fast) var(--ease); }
.ov span { position: absolute; top: -15px; left: -1.5px; font-size: 9px; padding: .5px 4px; border-radius: 3px;
  color: #fff; white-space: nowrap; font-weight: 600; }
.ov.field { border-color: var(--brand); background: rgba(91,141,239,.13); }
.ov.field span { background: var(--brand); }
.ov.line { border-color: #0f8a7a; background: rgba(15,138,122,.12); }
.ov.line span { background: #0f8a7a; }
.ov.finding { border-color: var(--danger); background: rgba(251,113,133,.13); }
.ov.finding span { background: var(--danger); }
.kv { display: grid; grid-template-columns: 1fr; gap: 0; }
.kv-row { display: grid; grid-template-columns: 152px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv-row:last-child { border-bottom: 0; }
.kv-row .k { color: var(--text-faint); font-size: 12px; }
.kv-row .v { font-size: 12.5px; word-break: break-word; }
.kv-row .c { font-size: 11px; color: var(--text-faint); text-align: right; font-variant-numeric: tabular-nums; }
.conf { display: flex; align-items: center; gap: 7px; }
.conf .cbar { width: 42px; height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.conf .cbar i { display: block; height: 100%; border-radius: 3px; }
.totals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r-md); overflow: hidden; }
.totals-grid div { background: var(--surface); padding: 11px 13px; }
.totals-grid .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
.totals-grid .val { font-size: 16px; font-weight: 640; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* Upload / dropzone */
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 34px 20px; text-align: center;
  background: var(--surface-2); transition: all var(--fast) var(--ease); cursor: pointer; }
.drop:hover, .drop.on { border-color: var(--brand); background: var(--brand-soft); }
.drop b { display: block; font-size: 13.5px; margin-bottom: 4px; }

/* Progress + toasts + palette */
.progress { height: 5px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width 300ms linear; }
.toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 95; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--surface-3); border: 1px solid var(--line-strong); color: var(--text); padding: 10px 16px;
  border-radius: var(--r-md); font-size: 12.5px; box-shadow: var(--shadow-md); opacity: 0; transform: translateY(8px);
  transition: all var(--med) var(--ease); backdrop-filter: blur(10px); }
.toast.on { opacity: 1; transform: none; }
.tip { position: fixed; z-index: 99; pointer-events: none; background: var(--surface-3); border: 1px solid var(--line-strong);
  color: var(--text); padding: 7px 10px; border-radius: var(--r-sm); font-size: 11.5px; box-shadow: var(--shadow-md);
  opacity: 0; transition: opacity var(--fast) var(--ease); max-width: 260px; }
.tip.on { opacity: 1; }
.palette { position: fixed; inset: 0; z-index: 90; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.palette.on { display: flex; }
.palette .box { width: min(620px, 92vw); background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  padding: 15px 18px; font-size: 14px; outline: 0; }
.palette .res { max-height: 52vh; overflow: auto; }
.palette .row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; }
.palette .row:hover, .palette .row.sel { background: var(--surface-2); }
.skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
  background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: 6px; }
@keyframes sk { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.spin { width: 13px; height: 13px; border: 2px solid var(--line-strong); border-top-color: var(--brand);
  border-radius: 50%; animation: sp .7s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }
.fade-in { animation: fi 320ms var(--ease) both; }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 74px 1fr !important; }
  .brand-text, .nav-label, .rail-foot-text, .nav .pill { display: none !important; }
  .nav button { justify-content: center; }
  .search { min-width: 0; width: 46px; }
  .search span, .search kbd { display: none; }
  .view { padding: 16px 14px 48px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- ============================ rail ============================ -->

      <div class="nav-section">Platform</div>
      <button data-view="blocks">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 2.8 20.5 7v10L12 21.2 3.5 17V7z"/><path d="M3.5 7 12 11.4 20.5 7M12 11.4v9.8"/></svg>
        <span class="nav-label">Audit blocks</span>
      </button>
      <button data-view="ingest">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
        <span class="nav-label">Ingestion</span>

    <div class="rail-foot">
      <div class="health">
        <i class="dot" id="healthDot"></i>

          <b id="healthText">Connecting…</b>

      <div class="env rail-foot-text" id="envBlock"></div>
    </div>
  </aside>

  <!-- ============================ main ============================ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="railToggle" title="Collapse navigation" aria-label="Collapse navigation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h9M4 18h16"/></svg>
      </button>

      <div class="search" id="searchBtn" role="button" tabindex="0" aria-label="Search invoices">

        Run all 21

    <input id="paletteInput" placeholder="Search invoices, vendors, findings…" autocomplete="off" />
    <div class="res" id="paletteRes"></div>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  "use strict";

  /* =========================================================================
     Utilities
     ========================================================================= */
  var $ = function (id) { return document.getElementById(id); };
  function esc(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function arr(value) { return Array.isArray(value) ? value : []; }
  function pct(value, digits) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    return (Number(value) * 100).toFixed(digits === undefined ? 1 : digits) + "%";
  }
  function money(value, currency) {
    if (value === null || value === undefined || isNaN(value) || value === "") return "—";
    return (currency || "$") + Number(value).toLocaleString(undefined,
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function money0(value) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    return "$" + Math.round(Number(value)).toLocaleString();
  }
  function num(value, digits) {
    if (value === null || value === undefined || isNaN(value)) return "—";
    return Number(value).toFixed(digits === undefined ? 2 : digits);
  }
  function when(stamp) { return stamp ? String(stamp).replace("T", " ").slice(0, 16) : "—"; }
  function initials(name) {
    var parts = String(name || "?").replace(/[^A-Za-z0-9 ]/g, " ").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  var AVATAR_COLORS = ["#5B8DEF", "#0F8A7A", "#A78BFA", "#E8794B", "#22A6B3", "#D4578E", "#5C7CFA", "#12A594"];
  function avatarColor(seed) {
    var hash = 0, text = String(seed || "");
    for (var i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) % 9973;
    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
  }
  function avatar(name) {
    return '<span class="avatar" style="background:' + avatarColor(name) + '">' + esc(initials(name)) + "</span>";
  }
  var DECISIONS = ["AUTO_APPROVED", "PENDING_REVIEW", "QUARANTINED", "REJECTED"];
  var DECISION_COLOR = { AUTO_APPROVED: "var(--ok)", PENDING_REVIEW: "var(--warn)", QUARANTINED: "var(--danger)", REJECTED: "var(--violet)" };
  var BAND_COLOR = { LOW: "var(--ok)", MEDIUM: "var(--warn)", HIGH: "#E8794B", CRITICAL: "var(--danger)" };
  var SEVERITY_ORDER = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"];
  function decisionChip(decision) {
    return '<span class="chip ' + esc(decision) + '">' + esc(String(decision || "").replace(/_/g, " ")) + "</span>";
  }
  function riskColor(risk) {
    return risk >= 0.75 ? "var(--danger)" : risk >= 0.35 ? "var(--warn)" : "var(--ok)";
  }

  function toast(message) {
    var wrap = $("toasts");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    wrap.appendChild(el);
    requestAnimationFrame(function () { el.classList.add("on"); });
    setTimeout(function () {
      el.classList.remove("on");
      setTimeout(function () { el.remove(); }, 300);
    }, 3000);
  }

  function api(path, options) {
    return fetch(path, options).then(function (response) {
      if (!response.ok) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          throw new Error(body.detail || ("HTTP " + response.status));
        });
      }
      return response.status === 204 ? {} : response.json();
    });
  }

  /* Generic tooltip: any element with data-tip shows it on hover. */
  var tipEl = $("tip");
  document.addEventListener("mousemove", function (event) {
    var target = event.target.closest ? event.target.closest("[data-tip]") : null;
    if (!target) { tipEl.classList.remove("on"); return; }
    tipEl.innerHTML = target.getAttribute("data-tip");
    tipEl.classList.add("on");
    var width = tipEl.offsetWidth, height = tipEl.offsetHeight;
    var x = Math.min(event.clientX + 14, window.innerWidth - width - 12);
    var y = Math.max(10, event.clientY - height - 12);
    tipEl.style.left = x + "px";
    tipEl.style.top = y + "px";
  });

  /* =========================================================================
     State
     ========================================================================= */
  var State = {
    theme: localStorage.getItem("ap-theme") || "dark",
    view: "overview",
    railCollapsed: localStorage.getItem("ap-rail") === "1",
    dashboard: null,
    invoices: [],
    detail: null,
    job: null,
    filter: { decision: "ALL", q: "", band: "ALL" },
    sort: { key: "risk_score", dir: -1 },
    page: 0,
    pageSize: 12,
    drawerTab: "overview",
    overlays: { fields: true, lines: true, findings: true },
    paletteIndex: 0,
    paletteResults: [],
    lastUpload: null, lastEmail: null,
    daily: null, bench: null, network: null, feedback: null, ledger: null, erp: null, jobs: [],
    payments: null, paymentRail: null, lastRun: null, remittance: null,
    contracts: null, blocks: null, proof: null
  };

  /* =========================================================================
     Charts (hand-rolled SVG — no external libraries)
     ========================================================================= */
  function donut(rows, size, thickness) {
    size = size || 176; thickness = thickness || 17;
    var total = rows.reduce(function (sum, r) { return sum + r.value; }, 0);
    var radius = (size - thickness) / 2, circumference = 2 * Math.PI * radius, offset = 0;
    var svg = '<svg viewBox="0 0 ' + size + " " + size + '" style="width:' + size + "px;height:" + size + 'px" class="chart">';
    svg += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + radius + '" fill="none" stroke="var(--surface-3)" stroke-width="' + thickness + '"/>';
    if (total > 0) {
      rows.forEach(function (row) {
        if (!row.value) return;
        var length = (row.value / total) * circumference;
        svg += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + radius + '" fill="none" stroke="' + row.color +
          '" stroke-width="' + thickness + '" stroke-linecap="butt" stroke-dasharray="' + length + " " + (circumference - length) +
          '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + size / 2 + " " + size / 2 + ')">' +
          '<title>' + esc(row.label) + ": " + row.value + "</title></circle>";
        offset += length;
      });
    }
    svg += '<text x="' + size / 2 + '" y="' + (size / 2 - 3) + '" text-anchor="middle" style="fill:var(--text);font-size:25px;font-weight:680;letter-spacing:-.03em">' + total + "</text>";
    svg += '<text x="' + size / 2 + '" y="' + (size / 2 + 15) + '" text-anchor="middle" style="fill:var(--text-faint);font-size:10.5px;letter-spacing:.05em">INVOICES</text>';
    return svg + "</svg>";
  }

  function stackedBand(rows, height) {
    height = height || 10;
    var total = rows.reduce(function (sum, r) { return sum + r.value; }, 0) || 1;
    var html = '<div style="display:flex;height:' + height + 'px;border-radius:6px;overflow:hidden;background:var(--surface-3)">';
    rows.forEach(function (row) {
      var width = (row.value / total) * 100;
      if (width <= 0) return;
      html += '<div style="width:' + width + '%;background:' + row.color + '" data-tip="' + esc(row.label + ": " + row.value) + '"></div>';
    });
    return html + "</div>";
  }

  function bars(rows, formatter) {
    var max = rows.reduce(function (top, r) { return Math.max(top, r.value); }, 0) || 1;
    return '<div class="bars">' + rows.map(function (row) {
      var width = (row.value / max) * 100;
      return '<div class="bar-row"><div class="top"><span class="l">' + esc(row.label) + '</span><span class="r">' +
        esc(formatter ? formatter(row.value) : row.value) + "</span></div>" +
        '<div class="track"><i style="width:' + width + "%;background:" + (row.color || "var(--brand)") + '"></i></div></div>';
    }).join("") + "</div>";
  }

  var RADAR_KEYS = [["duplicate", "Duplicates"], ["benford", "Benford"], ["isolation", "Behaviour"],
                    ["graph", "Graph"], ["match", "3-Way match"], ["extraction", "Extraction"]];

  function radar(scores) {
    var keys = RADAR_KEYS;
    var size = 290, cx = size / 2, cy = size / 2 + 4, radius = 100;
    var rings = 4, svg = '<svg viewBox="0 0 ' + size + " " + size + '" class="chart" style="max-height:250px">';
    for (var ring = 1; ring <= rings; ring++) {
      var points = [];
      for (var a = 0; a < 6; a++) {
        var angle = (Math.PI * 2 * a) / 6 - Math.PI / 2;
        var rr = (radius * ring) / rings;
        points.push((cx + rr * Math.cos(angle)).toFixed(1) + "," + (cy + rr * Math.sin(angle)).toFixed(1));
      }
      svg += '<polygon points="' + points.join(" ") + '" fill="none" stroke="var(--grid)"/>';
    }
    keys.forEach(function (key, index) {
      var angle = (Math.PI * 2 * index) / 6 - Math.PI / 2;
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + radius * Math.cos(angle)).toFixed(1) + '" y2="' +
        (cy + radius * Math.sin(angle)).toFixed(1) + '" stroke="var(--grid)"/>';
      var lx = cx + (radius + 30) * Math.cos(angle), ly = cy + (radius + 24) * Math.sin(angle) + 3.5;
      svg += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" class="lbl" style="font-size:10px">' + esc(key[1]) + "</text>";
    });
    var scorePoints = keys.map(function (key, index) {
      var value = Math.max(0, Math.min(1, Number(scores[key[0]] || 0)));
      var angle = (Math.PI * 2 * index) / 6 - Math.PI / 2;
      var rr = radius * value;
      return (cx + rr * Math.cos(angle)).toFixed(1) + "," + (cy + rr * Math.sin(angle)).toFixed(1);
    });
    svg += '<polygon points="' + scorePoints.join(" ") + '" fill="color-mix(in srgb, var(--brand) 26%, transparent)" stroke="var(--brand)" stroke-width="1.8"/>';
    keys.forEach(function (key, index) {
      var value = Math.max(0, Math.min(1, Number(scores[key[0]] || 0)));
      var angle = (Math.PI * 2 * index) / 6 - Math.PI / 2;
      var rr = radius * value;
      svg += '<circle cx="' + (cx + rr * Math.cos(angle)).toFixed(1) + '" cy="' + (cy + rr * Math.sin(angle)).toFixed(1) +
        '" r="3" fill="var(--brand)"><title>' + esc(key[1] + ": " + value.toFixed(2)) + "</title></circle>";
    });
    return svg + "</svg>";
  }

  /* the dial alone leaves the card half empty — pair it with the numbers behind it */
  function radarPanel(scores) {
    var values = RADAR_KEYS.map(function (key) {
      return { label: key[1], value: Math.max(0, Math.min(1, Number(scores[key[0]] || 0))) };
    }).sort(function (a, b) { return b.value - a.value; });
    var list = '<div class="radar-list">' + values.map(function (item) {
      var tone = item.value >= 0.75 ? "var(--danger)" : item.value >= 0.45 ? "var(--warn)" : "var(--brand)";
      return '<div class="radar-row"><span class="radar-name">' + esc(item.label) + "</span>" +
        '<span class="radar-track"><i style="width:' + Math.max(2, item.value * 100).toFixed(1) +
        "%;background:" + tone + '"></i></span><span class="radar-val">' + item.value.toFixed(2) + "</span></div>";
    }).join("") + "</div>";
    return '<div class="radar-panel">' + radar(scores) + list + "</div>";
  }

  function scatter(points) {
    if (!points.length) return '<div class="empty"><b>No invoices yet</b>run the pipeline to plot spend against risk</div>';
    var width = 760, height = 300, padL = 52, padB = 36, padT = 14, padR = 16;
    var maxAmount = points.reduce(function (top, p) { return Math.max(top, p.amount); }, 0) || 1;
    var xMax = Math.pow(10, Math.ceil(Math.log10(Math.max(10, maxAmount))));
    function x(value) {
      var logMin = 1, logMax = Math.log10(xMax);
      var ratio = (Math.log10(Math.max(1, value)) - logMin) / Math.max(0.0001, logMax - logMin);
      return padL + ratio * (width - padL - padR);
    }
    function y(value) { return height - padB - value * (height - padB - padT); }
    var svg = '<svg viewBox="0 0 ' + width + " " + height + '" class="chart" style="max-height:320px">';
    [0, 0.25, 0.5, 0.75, 1].forEach(function (tick) {
      svg += '<line class="gridline" x1="' + padL + '" y1="' + y(tick) + '" x2="' + (width - padR) + '" y2="' + y(tick) + '"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (y(tick) + 3.5) + '" text-anchor="end">' + tick.toFixed(2) + "</text>";
    });
    [0.5, 0.75].forEach(function (threshold) {
      svg += '<line x1="' + padL + '" y1="' + y(threshold) + '" x2="' + (width - padR) + '" y2="' + y(threshold) +
        '" stroke="var(--warn)" stroke-dasharray="3 4" opacity=".45"/>';
    });
    var decades = [];
    for (var power = 1; Math.pow(10, power) <= xMax * 1.001; power++) decades.push(Math.pow(10, power));
    decades.forEach(function (value) {
      svg += '<line class="gridline" x1="' + x(value) + '" y1="' + padT + '" x2="' + x(value) + '" y2="' + (height - padB) + '"/>';
      svg += '<text x="' + x(value) + '" y="' + (height - padB + 16) + '" text-anchor="middle">' + (value >= 1000 ? (value / 1000) + "k" : value) + "</text>";
    });
    svg += '<text x="' + (width / 2) + '" y="' + (height - 4) + '" text-anchor="middle">invoice value (log scale)</text>';
    svg += '<text x="12" y="' + (height / 2) + '" text-anchor="middle" transform="rotate(-90 12 ' + (height / 2) + ')">risk score</text>';
    points.forEach(function (point) {
      var colour = DECISION_COLOR[point.decision] || "var(--brand)";
      var radius = 4 + Math.min(6, (point.recoverable || 0) / 40000);
      var tip = "<b>" + esc(point.label) + "</b><br>" + esc(point.vendor || "") + "<br>" + money(point.amount) +
        " · risk " + num(point.risk, 2) + (point.recoverable ? "<br>at stake " + money(point.recoverable) : "");
      svg += '<circle class="pt" data-id="' + esc(point.invoice_id) + '" cx="' + x(point.amount).toFixed(1) + '" cy="' +
        y(point.risk).toFixed(1) + '" r="' + radius.toFixed(1) + '" fill="' + colour + '" fill-opacity=".78" stroke="' + colour +
        '" stroke-width="1.2" data-tip="' + esc(tip) + '" style="cursor:pointer"></circle>';
    });
    return svg + "</svg>";
  }

  function benfordChart(chart, digits) {
    var observed = arr(chart.observed), expected = arr(chart.expected);
    if (!observed.length) return '<div class="empty">Not enough amounts yet.</div>';
    var width = 640, height = 230, padL = 34, padB = 30, padT = 16;
    var slot = (width - padL - 12) / observed.length;
    var max = Math.max.apply(null, observed.concat(expected)) || 1;
    var svg = '<svg viewBox="0 0 ' + width + " " + height + '" class="chart" style="max-height:250px">';
    [0, 0.5, 1].forEach(function (tick) {
      var yy = height - padB - tick * (height - padB - padT);
      svg += '<line class="gridline" x1="' + padL + '" y1="' + yy + '" x2="' + (width - 12) + '" y2="' + yy + '"/>';
      svg += '<text x="' + (padL - 7) + '" y="' + (yy + 3.5) + '" text-anchor="end">' + Math.round(tick * max) + "%</text>";
    });
    observed.forEach(function (value, index) {
      var bx = padL + index * slot;
      var observedH = (value / max) * (height - padB - padT);
      var expectedH = (expected[index] / max) * (height - padB - padT);
      var deviation = value - expected[index];
      svg += '<rect x="' + (bx + slot * 0.14) + '" y="' + (height - padB - observedH) + '" width="' + slot * 0.34 +
        '" height="' + observedH + '" rx="2.5" fill="' + (Math.abs(deviation) > 3 ? "var(--warn)" : "var(--cyan)") + '">' +
        "<title>digit " + (index + 1) + ": observed " + value.toFixed(1) + "% vs expected " + expected[index].toFixed(1) + "%</title></rect>";
      svg += '<rect x="' + (bx + slot * 0.52) + '" y="' + (height - padB - expectedH) + '" width="' + slot * 0.34 +
        '" height="' + expectedH + '" rx="2.5" fill="var(--line-strong)"><title>Benford expected</title></rect>';
      svg += '<text x="' + (bx + slot / 2) + '" y="' + (height - padB + 15) + '" text-anchor="middle">' + (index + 1) + "</text>";
    });
    svg += '<rect x="' + padL + '" y="4" width="9" height="9" rx="2" fill="var(--cyan)"/>';
    svg += '<text x="' + (padL + 14) + '" y="12.5">observed</text>';
    svg += '<rect x="' + (padL + 80) + '" y="4" width="9" height="9" rx="2" fill="var(--line-strong)"/>';
    svg += '<text x="' + (padL + 94) + '" y="12.5">Benford expected</text>';
    return svg + "</svg>";
  }

  function sparkline(values, colour) {
    if (!values.length) return "";
    var width = 92, height = 26;
    var max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    var span = (max - min) || 1;
    var points = values.map(function (value, index) {
      var x = (index / Math.max(1, values.length - 1)) * width;
      var y = height - 3 - ((value - min) / span) * (height - 6);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    return '<svg viewBox="0 0 ' + width + " " + height + '" style="width:' + width + "px;height:" + height + 'px">' +
      '<polyline points="' + points.join(" ") + '" fill="none" stroke="' + (colour || "var(--brand)") +
      '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  /* =========================================================================
     Views
     ========================================================================= */
  function kpiTile(options) {
    return '<div class="card kpi fade-in"' + (options.title ? ' title="' + esc(options.title) + '"' : "") + ">" +
      '<div class="k-label">' + esc(options.label) + "</div>" +

      (options.meter === undefined ? "" : '<div class="meter ' + (options.meterClass || "") + '"><i style="width:' +
        Math.max(0, Math.min(100, options.meter)) + '%"></i></div>') +
      '<div class="k-foot"><span>' + (options.foot || "") + "</span>" + (options.right || "") + "</div></div>";

  function invoiceRows(list, options) {

      return '<tr class="clickable" data-id="' + esc(row.invoice_id) + '">' +

        '<td class="mono muted" style="font-size:11.5px">' + esc(row.invoice_number || "—") + "</td>" +
        '<td class="t-right num">' + money(row.total_amount) + "</td>" +
        '<td class="t-right num">' + pct(row.document_confidence, 0) + "</td>" +
        '<td><div style="display:flex;align-items:center;gap:8px"><span class="riskbar"><i style="width:' +
          (Math.min(1, risk) * 100) + "%;background:" + riskColor(risk) + '"></i></span><span class="num">' + num(risk, 2) + "</span></div></td>" +
        "<td>" + decisionChip(row.decision) + "</td>" +

    }).join("");
    return "<table><thead><tr>" +
      '<th class="sortable" data-sort="vendor_name">Vendor <span class="arrow">⇅</span></th>' +
      "<th>Invoice no.</th>" +
      '<th class="t-right sortable" data-sort="total_amount">Amount <span class="arrow">⇅</span></th>' +
      '<th class="t-right sortable" data-sort="document_confidence">Confidence <span class="arrow">⇅</span></th>' +
      '<th class="sortable" data-sort="risk_score">Risk <span class="arrow">⇅</span></th>' +
      "<th>Decision</th><th>Review</th>" +
      (options.showAgreement === false ? "" : "<th>Expected</th>") +
      "</tr></thead><tbody>" + rows + "</tbody></table>";
  }

  function filteredInvoices() {
    var list = State.invoices.slice();
    if (State.filter.decision !== "ALL") list = list.filter(function (row) { return row.decision === State.filter.decision; });
    if (State.filter.band !== "ALL") list = list.filter(function (row) { return row.risk_band === State.filter.band; });
    if (State.filter.q) {
      var needle = State.filter.q.toLowerCase();
      list = list.filter(function (row) {
        return [row.vendor_name, row.invoice_number, row.invoice_id, row.po_number, row.decision]
          .filter(Boolean).join(" ").toLowerCase().indexOf(needle) >= 0;
      });
    }
    var key = State.sort.key, dir = State.sort.dir;
    list.sort(function (a, b) {
      var left = a[key], right = b[key];
      if (typeof left === "string" || typeof right === "string") {
        return String(left || "").localeCompare(String(right || "")) * dir;
      }
      return ((Number(left) || 0) - (Number(right) || 0)) * dir;
    });
    return list;
  }

  function graphSvg(graph) {
    var nodes = arr(graph.nodes), edges = arr(graph.edges);
    var hubs = nodes.filter(function (node) {
      return (node.kind === "bank" || node.kind === "address") &&
        edges.filter(function (e) { return e.target === node.id; }).length > 1;
    });
    var hubIds = {};
    hubs.forEach(function (hub) { hubIds[hub.id] = true; });
    var vendors = nodes.filter(function (n) { return n.kind === "vendor"; });
    var employees = nodes.filter(function (n) { return n.kind === "employee"; });
    var positions = {}, width = 900, height = Math.max(380, hubs.length * 46 + 160);
    vendors.forEach(function (node, index) {
      positions[node.id] = { x: 168, y: 48 + (index * (height - 96)) / Math.max(1, vendors.length - 1) };
    });
    employees.forEach(function (node, index) {
      positions[node.id] = { x: 736, y: 70 + (index * (height - 150)) / Math.max(1, employees.length - 1) };
    });
    hubs.forEach(function (node, index) {
      positions[node.id] = { x: 452, y: 54 + (index * (height - 108)) / Math.max(1, hubs.length - 1) };
    });
    nodes.forEach(function (node) { if (!positions[node.id]) positions[node.id] = { x: 452, y: height / 2 }; });
    var svg = '<svg viewBox="0 0 ' + width + " " + height + '" class="chart">';
    edges.forEach(function (edge) {
      var a = positions[edge.source], b = positions[edge.target];
      if (!a || !b) return;
      var shared = hubIds[edge.target];
      var colour = shared ? "var(--danger)" : (edge.kind === "PAID_INTO" ? "var(--brand)" : "var(--line-strong)");
      var midX = (a.x + b.x) / 2;
      svg += '<path d="M' + a.x + " " + a.y + " C " + midX + " " + a.y + ", " + midX + " " + b.y + ", " + b.x + " " + b.y +
        '" fill="none" stroke="' + colour + '" stroke-width="' + (shared ? 1.7 : 1) + '" opacity="' + (shared ? .8 : .55) + '"/>';
    });
    nodes.forEach(function (node) {
      var point = positions[node.id];
      var hub = hubIds[node.id];
      var colour = node.kind === "vendor" ? "#0F8A7A" : node.kind === "employee" ? "var(--brand)"
        : node.kind === "bank" ? (hub ? "var(--danger)" : "var(--text-faint)") : "var(--warn)";
      var radius = hub ? 8 : (node.kind === "vendor" || node.kind === "employee" ? 6.5 : 4);
      svg += '<circle cx="' + point.x + '" cy="' + point.y + '" r="' + radius + '" fill="' + colour + '"' +
        (hub ? ' stroke="var(--danger)" stroke-width="4" stroke-opacity=".22"' : "") + "><title>" +
        esc(node.label + " (" + node.kind + ")") + "</title></circle>";
      var label = String(node.label || "");
      var anchor = node.kind === "employee" ? "start" : "end";
      var dx = node.kind === "employee" ? 12 : -12;
      if (label.length > 24) label = label.slice(0, 22) + "…";
      svg += '<text x="' + (point.x + dx) + '" y="' + (point.y + 3.5) + '" text-anchor="' + anchor +
        '" style="font-size:10.5px;fill:var(--text-dim)">' + esc(label) + "</text>";
    });
    return svg + "</svg>" +
      '<div class="muted" style="font-size:11.5px;margin-top:8px">' +
      '<span class="dotline" style="background:#0F8A7A"></span> vendor &nbsp; ' +
      '<span class="dotline" style="background:var(--brand)"></span> employee &nbsp; ' +
      '<span class="dotline" style="background:var(--danger)"></span> shared account &nbsp; ' +
      "Red links are the conflicts: an account or address that both a vendor and an employee touch.</div>";
  }

  function channelStrip() {
    var list = arr(State.invoices);
    function tally(predicate) {
      var out = { total: 0, auto: 0, risk: 0, value: 0 };
      list.forEach(function (row) {
        if (!predicate(String(row.source || "corpus").toLowerCase())) return;
        out.total += 1;
        if (row.decision === "AUTO_APPROVED") out.auto += 1;
        out.risk += Number(row.risk_score || 0);
        out.value += Number(row.total_amount || 0);
      });
      return out;
    }
    var channels = [
      { name: "Email mailbox", caption: "invoices@company.com", row: tally(function (s) { return s === "email"; }) },
      { name: "Portal / REST", caption: "clerk upload and API push", row: tally(function (s) { return s === "portal" || s === "upload" || s === "api"; }) },
      { name: "Batch replay", caption: "document set processed as a job", row: tally(function (s) { return s === "corpus" || s === "batch"; }) }
    ];
    return '<div class="grid c3" style="margin-bottom:14px">' + channels.map(function (channel) {
      var row = channel.row, clear = row.total ? Math.round((row.auto / row.total) * 100) : 0;
      return '<div class="card"><div class="card-h"><h3>' + esc(channel.name) + '</h3><span class="sub">' +
        esc(channel.caption) + "</span></div>" +
        '<div class="card-b"><div class="k-value">' + row.total + "</div>" +
        '<div class="k-foot"><span>documents ingested</span><span class="chip ' + (clear >= 60 ? "ok" : "muted") + '">' +
        clear + "% straight through</span></div>" +
        '<div class="mm-grid"><div><span>average risk</span><b>' +
        (row.total ? (row.risk / row.total).toFixed(2) : "—") + "</b></div>" +
        "<div><span>value seen</span><b>" + money0(row.value) + "</b></div></div></div></div>";
    }).join("") + "</div>";
  }

  /* =========================================================================

     ========================================================================= */
  var DRAWER_TABS = [["overview", "Overview"], ["document", "Document"], ["evidence", "Evidence"],
                     ["match", "Match"], ["correct", "Correct"], ["trace", "Trace"]];

  function openInvoice(id) {
    State.drawerTab = "overview";
    $("drawer").classList.add("on");
    $("drawer").setAttribute("aria-hidden", "false");
    $("scrim").classList.add("on");
    $("dwTitle").textContent = "Loading…";
    $("dwSub").textContent = "";
    $("dwActions").innerHTML = "";
    $("dwTabs").innerHTML = "";
    $("dwBody").innerHTML = '<div class="skel" style="height:240px"></div>';
    api("/api/invoices/" + id).then(function (detail) {
      State.detail = detail;
      renderDrawer();
    }).catch(function (error) {
      $("dwTitle").textContent = "Not found";
      $("dwBody").innerHTML = '<div class="empty">' + esc(error.message) + "</div>";
    });

  function closeDrawer() {
    $("drawer").classList.remove("on");
    $("drawer").setAttribute("aria-hidden", "true");
    $("scrim").classList.remove("on");
    State.detail = null;
  }

  function renderDrawer() {
    var detail = State.detail;
    if (!detail) return;
    var fraud = detail.fraud || {}, totals = detail.totals || {}, match = detail.match || {};
    $("dwTitle").innerHTML = esc(detail.vendor_name || "Unknown vendor");
    $("dwSub").innerHTML = esc(detail.invoice_number || "no number") + " · " +
      (detail.po_number ? "PO " + esc(detail.po_number) : "no PO") + " · " + money(totals.total) +
      " · risk " + num(fraud.risk_score, 2) + " · conf " + pct(detail.document_confidence, 0);
    $("dwTabs").innerHTML = DRAWER_TABS.map(function (tab) {
      return '<button data-tab="' + tab[0] + '" class="' + (State.drawerTab === tab[0] ? "active" : "") + '">' + tab[1] + "</button>";
    }).join("");
    $("dwActions").innerHTML =
      '<button class="btn sm ok" data-review="APPROVED">Approve</button>' +
      '<button class="btn sm danger" data-review="REJECTED">Reject</button>' +
      '<button class="btn sm" data-review="ESCALATED">Escalate</button>' +
      '<span class="chip muted">' + esc(detail.review_status || "OPEN") + "</span>";

    var body = "";
    if (State.drawerTab === "overview") body = drawerOverview(detail);
    else if (State.drawerTab === "document") body = drawerDocument(detail);
    else if (State.drawerTab === "evidence") body = drawerEvidence(detail);
    else if (State.drawerTab === "match") body = drawerMatch(detail);
    else if (State.drawerTab === "correct") body = drawerCorrect(detail);
    else body = drawerTrace(detail);
    $("dwBody").innerHTML = body;

  function drawerOverview(detail) {
    var fraud = detail.fraud || {}, totals = detail.totals || {};
    var verdict = detail.decision === "AUTO_APPROVED" ? "ok" :
      (detail.decision === "QUARANTINED" || detail.decision === "REJECTED") ? "bad" : "warn";
    var notes = [];
    if (detail.label && detail.label.notes) notes.push(detail.label.notes);
    if (detail.correct === 1) notes.push("The decision matches the ground-truth label for this document.");
    if (detail.correct === 0) notes.push("The decision differs from the ground-truth label for this document.");
    var html = '<div class="banner ' + verdict + '" style="margin-bottom:14px"><div style="flex:1">' +
      '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">' + decisionChip(detail.decision) +
      "<b>" + esc(detail.decision_reason || "") + "</b></div>" +
      (notes.length ? '<div class="muted" style="margin-top:6px;font-size:12px">' + notes.map(esc).join(" ") + "</div>" : "") +
      "</div><div style='text-align:right' class='num muted' style='font-size:11.5px'>" +
      num((detail.processing_ms || 0) / 1000, 2) + " s · $" + Number(detail.cost_usd || 0).toFixed(4) + "</div></div>";

    html += '<div class="grid c2e" style="margin-bottom:14px">' +
      '<div class="card"><div class="card-h"><h3>Extracted fields</h3><span class="sub">with confidence</span></div>' +
      '<div class="card-b"><div class="kv">' + arr(detail.header_fields).map(function (field) {
        var confidence = Number(field.confidence || 0);
        var colour = confidence >= 0.85 ? "var(--ok)" : confidence >= 0.6 ? "var(--warn)" : "var(--danger)";
        return '<div class="kv-row"><span class="k">' + esc(field.label) + "</span><span class=\"v " +
          (field.missing ? "muted" : "mono") + '">' + (field.missing ? "not found on the document" : esc(field.display)) +
          '</span><span class="c">' + (field.missing ? "" : '<span class="conf"><span class="cbar"><i style="width:' +
          (confidence * 100) + "%;background:" + colour + '"></i></span>' + pct(confidence, 0) + "</span>") + "</span></div>";
      }).join("") + "</div></div></div>";
    html += '<div class="card"><div class="card-h"><h3>Amounts</h3><span class="sub">arithmetic check</span></div>' +
      '<div class="card-b"><div class="totals-grid">' +
      [["Subtotal", totals.subtotal], ["Tax", totals.tax], ["Shipping", totals.shipping],
       ["Invoice total", totals.total], ["Line items sum", totals.line_item_sum]].map(function (pair) {
        return '<div><div class="lab">' + esc(pair[0]) + '</div><div class="val">' + money(pair[1]) + "</div></div>";
      }).join("") + "</div>" +
      '<div class="banner ' + (totals.arithmetic_ok ? "ok" : "bad") + '" style="margin-top:12px">' +
      (totals.arithmetic_ok
        ? "<div><b>Arithmetic closes.</b> subtotal + tax + shipping equals the printed total.</div>"
        : "<div><b>Arithmetic does not close.</b> The printed total differs by " + money(totals.total_delta) +
          ". Inflating a total above subtotal + tax is a classic tampering pattern — it hides inside a PO comparison " +
          "because the PO holds pre-tax values.</div>") + "</div></div></div></div>";

    html += '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>Findings (' + arr(fraud.findings).length + ")</h3>" +
      '<span class="sub">engine by engine</span></div><div class="card-b"><div class="stack">' +
      (arr(fraud.findings).length ? arr(fraud.findings).map(findingCard).join("")
        : '<div class="empty">No findings — every check passed.</div>') + "</div></div></div>";

      '<span class="spacer"></span>' +
      (finding.recoverable_amount ? '<span class="chip bad">' + money(finding.recoverable_amount) + " at stake</span>" : "") +

    var html = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">' +
      '<span class="chip ' + (match.po_found ? "ok" : "bad") + '">' + (match.po_found ? "PO found" : "PO missing") + "</span>" +
      '<span class="chip ' + (match.grn_found ? "ok" : "bad") + '">' + (match.grn_found ? "GRN found" : "GRN missing") + "</span>" +
      '<span class="chip ' + (match.fully_matched ? "ok" : "bad") + '">' + (match.fully_matched ? "fully matched" : "not fully matched") + "</span>" +
      '<span class="chip ' + (match.within_tolerance ? "ok" : "warn") + '">' +
      (match.within_tolerance ? "within tolerance" : "outside tolerance") + "</span></div>";
    html += '<div class="totals-grid" style="margin-bottom:14px">' +
      [["PO value (pre-tax)", match.po_total], ["Goods received", match.grn_total], ["Invoice subtotal", match.invoice_total],
       ["Total variance", (match.total_variance || 0) + " (" + pct(match.total_variance_pct, 2) + ")"]].map(function (pair) {
        return '<div><div class="lab">' + esc(pair[0]) + '</div><div class="val">' +
          (typeof pair[1] === "number" || pair[1] === null ? money(pair[1]) : esc(pair[1])) + "</div></div>";
      }).join("") + "</div>";
    if (match.purchase_order) {
      var po = match.purchase_order;
      html += '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>' + esc(po.po_number) + " · " + esc(po.vendor_name) + "</h3>" +
        '<span class="sub">raised ' + esc(po.issued_on || "") + " · buyer " + esc(po.buyer || "—") + "</span></div>" +
        '<div style="overflow:auto"><table><thead><tr><th>#</th><th>Description</th><th class="t-right">Qty</th>' +
        '<th class="t-right">Unit</th><th class="t-right">Amount</th></tr></thead><tbody>' +
        arr(po.lines).map(function (line) {
          return '<tr><td class="num">' + line.line_no + "</td><td>" + esc(line.description) + '</td><td class="t-right num">' +
            num(line.quantity, 0) + '</td><td class="t-right num">' + money(line.unit_price) + '</td><td class="t-right num">' +
            money(line.amount) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
    if (arr(match.line_matches).length) {
      html += '<div class="card"><div class="card-h"><h3>Line-level reconciliation</h3><span class="sub">fuzzy description match against the PO</span></div>' +
        '<div style="overflow:auto"><table><thead><tr><th>Inv #</th><th>PO #</th><th class="t-right">Description score</th>' +
        '<th class="t-right">Qty Δ</th><th class="t-right">Price Δ</th><th class="t-right">Amount Δ</th><th>Status</th></tr></thead><tbody>' +
        match.line_matches.map(function (line) {
          var statusColour = line.status === "MATCHED" ? "ok" : (line.status === "UNMATCHED" ? "bad" : "warn");
          return '<tr><td class="num">' + esc(line.invoice_line) + '</td><td class="num">' + esc(line.po_line === null ? "—" : line.po_line) +
            '</td><td class="t-right num">' + pct(line.description_score, 0) + '</td><td class="t-right num">' + num(line.quantity_delta, 0) +
            '</td><td class="t-right num">' + money(line.price_delta) + '</td><td class="t-right num">' + money(line.amount_delta) +
            '</td><td><span class="chip ' + statusColour + '">' + esc(String(line.status).replace(/_/g, " ")) + "</span></td></tr>";
        }).join("") + "</tbody></table></div></div>";
    }
    return html;

  function drawerCorrect(detail) {
    var editable = [["vendor_name", "Vendor name"], ["invoice_number", "Invoice number"], ["po_number", "PO number"],
                    ["vendor_tax_id", "Vendor tax ID"], ["vendor_bank_account", "Bank account"], ["total", "Invoice total"]];

    return '<div class="banner brand" style="margin-bottom:14px"><div><b>Human in the loop.</b> Edit any value the model ' +

      "decision is shown, and the pair becomes training data for the next extraction model.</div></div>" +

      editable.map(function (field) {
        var value = field[0] === "total" ? (totals.total || "") : (detail[field[0]] || "");

        return '<label><div class="k-label" style="font-size:11.5px;color:var(--text-faint);margin-bottom:5px">' + esc(field[1]) +
          (confidence === undefined ? "" : ' <span class="muted">(' + pct(confidence, 0) + ")</span>") + "</div>" +
          '<div class="field"><input data-correct="' + field[0] + '" value="' + esc(value) + '"></div></label>';
      }).join("") + "</div>" +
      '<div style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap">' +
      '<button class="btn primary" id="applyCorrections">Apply corrections &amp; re-assess</button>' +
      '<span id="correctionResult" class="muted" style="font-size:12px"></span></div>' +
      (arr(detail.review_history).length ? '<div class="sep"></div><h3 style="font-size:12.5px;margin-bottom:8px">Review history</h3>' +
        '<table><thead><tr><th>When</th><th>Action</th><th>Decision</th><th>Risk</th></tr></thead><tbody>' +
        arr(detail.review_history).map(function (row) {
          return '<tr><td class="muted">' + when(row.at) + "</td><td>" + esc(row.action) + "</td><td>" +
            esc(row.decision_before) + " → " + esc(row.decision_after) + '</td><td class="num">' +
            num(row.risk_before, 2) + " → " + num(row.risk_after, 2) + "</td></tr>";

  function decisionTrail(detail) {
    var history = arr(detail.review_history);
    if (!history.length) {
      var auto = detail.decision === "AUTO_APPROVED";
      return '<div class="env-head" style="margin-top:18px">Human review</div>' +
        '<div class="muted" style="font-size:11.5px">' + (auto
          ? "Cleared straight through — no clerk touched this invoice."
          : "Waiting on a clerk. Every action is written to the hash-chained ledger.") + "</div>";
    }
    return '<div class="env-head" style="margin-top:18px">Review trail (' + history.length + ")</div>" +
      '<div class="trail">' + history.map(function (event) {
        var tone = event.action === "APPROVED" ? "ok" : event.action === "REJECTED" ? "bad" : "warn";
        var label = event.kind === "correction" ? "correction" : String(event.action || "").toLowerCase();
        return '<div class="trail-row"><span class="trail-dot ' + tone + '"></span>' +
          '<span class="trail-body"><b>' + esc(event.actor || "clerk") + '</b> <span class="chip ' + tone + '">' +
          esc(label) + "</span><div>" + esc(event.detail || "") + "</div></span>" +
          '<span class="trail-when">' + esc(when(event.at)) + "</span></div>";
      }).join("") + "</div>";
  }

  function drawerTrace(detail) {
    var trace = arr(detail.trace);
    var html = trace.length ? "" : '<div class="empty">No pipeline trace recorded.</div>';
    if (!trace.length) return html + decisionTrail(detail);
    var maxMs = trace.reduce(function (top, step) { return Math.max(top, Number(step.ms || 0)); }, 1);
    return '<div class="bars">' + trace.map(function (step) {
      return '<div class="bar-row"><div class="top"><span class="l mono">' + esc(step.stage) + '</span><span class="r">' +
        num(step.ms, 0) + " ms</span></div><div class=\"track\"><i style=\"width:" +
        ((Number(step.ms || 0) / maxMs) * 100) + '%;background:var(--brand)"></i></div>' +
        '<div class="muted" style="font-size:11px;margin-top:4px;word-break:break-word">' + esc(String(step.detail).slice(0, 260)) + "</div></div>";
    }).join("") + "</div>" + decisionTrail(detail);
  }

  function paintOverlay() {
    var detail = State.detail;
    var overlay = $("overlay");
    if (!detail || !overlay) return;
    var width = detail.page_width || 1, height = detail.page_height || 1, out = "";
    function add(box, kind, label) {
      if (!box || box.length !== 4) return;
      var left = (box[0] / width) * 100, top = (box[1] / height) * 100;
      var w = ((box[2] - box[0]) / width) * 100, h = ((box[3] - box[1]) / height) * 100;
      if (w <= 0 || h <= 0) return;
      out += '<div class="ov ' + kind + '" style="left:' + left + "%;top:" + top + "%;width:" + w + "%;height:" + h +
        '%"><span>' + esc(label) + "</span></div>";
    }
    if (State.overlays.fields) {
      arr(detail.header_fields).forEach(function (field) { add(field.box, "field", field.label); });
      var boxes = (detail.totals || {}).boxes || {};
      ["subtotal", "tax", "shipping", "total"].forEach(function (key) { add(boxes[key], "field", key); });
    }
    if (State.overlays.lines) {
      arr(detail.line_items).forEach(function (line) { add(line.source_bbox, "line", "line " + line.line_no); });
    }
    if (State.overlays.findings) {
      arr((detail.fraud || {}).findings).forEach(function (finding) {
        add(finding.box, "finding", String(finding.type).replace(/_/g, " "));
      });
    }
    overlay.innerHTML = out;
  }

    return '<span class="chip ' + cls + '">' + esc(method || "—") + "</span>";
  }

  function viewPayments() {
    var history = State.payments || { payments: [] };
    var rail = State.paymentRail || { rail: {}, policy: {} };
    var rows = arr(history.payments);
    return '<div class="grid kpis" style="margin-bottom:14px"><div id="payKpis" style="display:contents">' +

      "</div></div>" +
      '<div class="grid c2e" style="margin-bottom:14px">' +
      '<div class="card"><div class="card-h"><h3>Payment rail</h3><span class="sub">where the money actually goes</span>' +

      '<div class="skel" style="height:150px"></div></div></div>' +

      '<div class="grid c2e">' +
      '<div class="card"><div class="card-h"><h3>Policy gates</h3><span class="sub">every check that can stop a payment</span></div>' +

      '<div class="card"><div class="card-h"><h3>Remittance advice</h3><span class="sub">what the supplier receives</span></div>' +
      '<div class="card-b"><pre id="remitBody" class="remit">Select “Advice” on a payment to preview it.</pre></div></div></div>';

  function payKpis() {
    var history = State.payments || {};
    var rail = (State.paymentRail || {}).rail || {};
    if (history.last_run) State.lastRun = State.lastRun || history.last_run;
    var released = Number(history.released || 0);
    var withheld = Number(history.withheld || 0);
    return kpiTile({ label: "Payments released", value: String(released),
                     foot: money0(history.value_paid || 0) + " settled",
                     right: '<span class="chip ok">' + esc(rail.mode || "sandbox") + "</span>" }) +
      kpiTile({ label: "Withheld by policy", value: String(withheld), foot: "held back for a human",
                right: withheld ? '<span class="chip warn">review</span>' : '<span class="chip ok">none</span>' }) +
      kpiTile({ label: "Discount captured", value: money0(history.discount_captured || 0),
                foot: "paid inside the discount window" }) +
      kpiTile({ label: "Reconciled", value: String((State.lastRun || {}).reconciliation ? State.lastRun.reconciliation.matched : (history.reconciled || released)),
                foot: "matched against the bank statement" }) +
      kpiTile({ label: "Rail mode", value: esc(String(rail.mode || "simulated")),
                foot: rail.moves_real_money ? "live money" : "no external connectivity",
                right: rail.moves_real_money ? '<span class="chip warn">live</span>' : '<span class="chip ok">sandbox</span>' });
  }

  function payTable(rows) {
    if (!rows.length) {
      return '<div class="empty"><b>No payments yet</b>Press “Run payments” to release every invoice the pipeline approved. ' +
        "Rejected, quarantined and unreviewed invoices are never paid.</div>";
    }
    return '<div style="overflow:auto"><table><thead><tr><th>Supplier</th><th>Invoice</th><th>Method</th>' +
      '<th class="t-right">Amount</th><th class="t-right">Discount</th><th>Status</th><th>End-to-end ID</th><th>Paid</th><th></th></tr></thead><tbody>' +
      rows.map(function (row) {
        return "<tr><td><div class=\"cell-vendor\">" + avatar(row.vendor_name) + "<b>" + esc(row.vendor_name || "") + "</b></div></td>" +
          '<td class="mono muted" style="font-size:11.5px">' + esc(row.invoice_number || row.invoice_id) + "</td>" +
          "<td>" + paymentMethodChip(row.settlement_method) + "</td>" +
          '<td class="t-right num">' + money(row.amount) + "</td>" +
          '<td class="t-right num muted">' + (row.discount_value ? "−" + money(row.discount_value) : "—") + "</td>" +
          '<td><span class="chip ' + (row.status === "SETTLED" ? "ok" : row.status === "WITHHELD" ? "warn" : "muted") + '">' +
          esc(row.status) + "</span></td>" +
          '<td class="mono muted" style="font-size:10.5px">' + esc(String(row.end_to_end_id || "").slice(0, 18)) + "</td>" +
          '<td class="muted" style="font-size:11.5px">' + when(row.created_at) + "</td>" +
          '<td><button class="btn tiny" data-remit="' + esc(row.payment_id) + '">Advice</button></td></tr>';
      }).join("") + "</tbody></table></div>";
  }

  function runSummary(run) {
    if (!run) return '<div class="muted" style="font-size:12.5px">No run in this session yet. ' +
      "The sandbox rail settles locally; selecting a live rail from the platform page moves real money.</div>";
    var recon = run.reconciliation || {};
    return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">' +
      '<span class="chip muted">' + esc(run.run_id) + "</span>" +
      '<span class="chip ok">' + (run.paid || []).length + " released</span>" +
      (run.withheld || []).length ? '<span class="chip warn">' + run.withheld.length + " withheld</span>" : "" +
      '<span class="chip muted">execution ' + esc(run.execution_date || "") + "</span></div>" +
      '<div class="stack"><div class="finding LOW"><div class="msg">' +
      esc(money0(run.total_paid || 0)) + " submitted · " + esc(money0(run.discount_captured || 0)) +
      " discount captured · " + (recon.matched || 0) + "/" + (recon.submitted || 0) + " reconciled against the bank statement</div>" +
      '<div class="ev">' + esc(recon.method || "") + "</div></div>" +
      arr(run.withheld).slice(0, 4).map(function (row) {
        return '<div class="finding MEDIUM"><div class="msg">' + esc(row.vendor_name || row.invoice_id) + " — " +
          esc(row.reason || "") + "</div></div>";
      }).join("") + "</div>";
  }

  function policyPanel(rail) {
    var policy = rail.policy || {};
    var rows = [
      ["Minimum document confidence", pct(policy.min_confidence || 0, 0)],
      ["Maximum per payment", money0(policy.max_amount_per_payment || 0)],
      ["Maximum per run", money0(policy.max_amount_per_run || 0)],
      ["Bank-account cooling-off", (policy.bank_change_cooling_off_days || 0) + " days after a change"],
      ["Verified bank account required", policy.require_verified_bank_account ? "yes" : "no"],
      ["Vendor name must match", policy.require_name_match ? "yes" : "no"],
      ["Duplicate window", (policy.duplicate_window_days || 0) + " days"],
      ["Payable decisions", arr(policy.paid_decisions).join(", ") || "AUTO_APPROVED"],
      ["Currencies", arr(policy.supported_currencies).join(", ")]
    ];
    return '<table><tbody>' + rows.map(function (row) {
      return "<tr><td>" + esc(row[0]) + '</td><td class="t-right num">' + esc(String(row[1])) + "</td></tr>";
    }).join("") + "</tbody></table>";
  }

  function railPanel(railInfo) {
    var rail = railInfo.rail || {};
    var info = railInfo.rail || {};
    var badge = $("railBadge");
    if (badge) {
      badge.innerHTML = '<span class="chip ' + (rail.moves_real_money ? "warn" : "ok") + '">' +
        (rail.moves_real_money ? "live money" : "no real transfer") + "</span>";
    }
    var modes = rail.modes || {};
    var rows = [
      ["Transport", rail.rail || "—"],
      ["Mode", rail.mode || "simulated"],
      ["Moves real money", rail.moves_real_money ? "yes" : "no"],
      ["Debtor", (rail.debtor || {}).name || "—"],
      ["Debtor account", (rail.debtor || {}).account || "—"],
      ["Message format", "ISO 20022 pain.001"],
      ["Return format", "ISO 20022 camt.053"],
      ["Payments on record", String((railInfo.rail || {}).paid_invoices || 0)]
    ];
    var html = "<table><tbody>" + rows.map(function (row) {
      return "<tr><td>" + esc(row[0]) + '</td><td class="t-right num">' + esc(String(row[1])) + "</td></tr>";
    }).join("") + "</tbody></table>";

      esc(rail.description || "") + "</div>";
    html += '<div class="stack">' + Object.keys(modes).map(function (mode) {
      var active = mode === (rail.mode === "simulated" ? "sandbox" : rail.mode);

        '<span class="chip ' + (active ? "ok" : "muted") + '">' + esc(mode) + "</span>" +
        '<span class="muted" style="font-size:11.5px">' + esc(modes[mode]) + "</span></div></div>";

  function loadPayments() {
    api("/api/payments/rail").then(function (body) {
      State.paymentRail = body.rail || {};
      var holder = $("railBody");
      if (holder) holder.innerHTML = railPanel(State.paymentRail);
      var policy = $("policyBody");
      if (policy) policy.innerHTML = policyPanel(State.paymentRail);
      State.lastRun = State.paymentRail.last_run || State.lastRun;
      var run = $("runBody");
      if (run) run.innerHTML = runSummary(State.lastRun);
    }).catch(function () {});
    api("/api/payments").then(function (body) {
      State.payments = body.history || { payments: [] };
      var kpis = $("payKpis");
      if (kpis) kpis.innerHTML = payKpis();
      var table = $("payTable");
      if (table) table.innerHTML = payTable(arr(State.payments.payments));
      var count = $("payCount");
      if (count) count.innerHTML = '<span class="chip muted">' + arr(State.payments.payments).length + " payments</span>";
    }).catch(function () {});
